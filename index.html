<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Golf Coach — v0.2.4</title>
  <style>
    :root {
      --bg: #0f1712;
      --fg: #e8e4d8;
      --dim: #8a8778;
      --accent: #9bc53d;
      --warn: #e5a823;
      --error: #d95f43;
      --rec: #e74c3c;
      --listen: #6fb4ff;
      --address: #5dade2;
      --top: #af7ac5;
      --impact: #f39c12;
      --finish: #ec87c0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    #video-container {
      position: relative;
      flex: 1;
      background: #000;
      overflow: hidden;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #rec-indicator {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #rec-indicator.active { display: flex; }

    #rec-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--rec);
      animation: pulse 1s infinite;
    }

    /* v0.2: listening indicator, distinct from REC */
    #listen-indicator {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      right: 16px;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: var(--fg);
    }

    #listen-indicator.active { display: flex; }

    #listen-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--listen);
      animation: pulse-slow 1.4s ease-in-out infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes pulse-slow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.8); } }

    /* v0.2.1: transient "shape heard" pill bottom-center */
    #shape-heard {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      opacity: 0;
      pointer-events: none;
      padding: 8px 18px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(155, 197, 61, 0.55);
      border-radius: 22px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--accent);
      transition: opacity 0.2s, transform 0.2s;
    }
    #shape-heard.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #rec-border {
      position: absolute;
      inset: 0;
      border: 4px solid transparent;
      pointer-events: none;
      transition: border-color 0.2s;
    }

    #rec-border.active { border-color: var(--rec); }
    #rec-border.countdown { border-color: var(--accent); }

    #countdown {
      position: absolute;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      font-size: min(30vw, 240px);
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    #countdown.active { display: flex; }

    #countdown-label {
      position: absolute;
      bottom: 15%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 18px;
      font-weight: 400;
      color: var(--fg);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      letter-spacing: 1px;
      display: none;
    }

    #controls {
      padding: 16px 20px calc(env(safe-area-inset-bottom, 16px) + 16px);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #status {
      text-align: center;
      font-size: 14px;
      color: var(--dim);
      min-height: 20px;
      letter-spacing: 0.3px;
    }

    #record-btn {
      width: 100%;
      padding: 20px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: var(--bg);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    #record-btn:active { transform: scale(0.98); }
    #record-btn.recording { background: var(--rec); color: #fff; }
    #record-btn.counting { background: var(--warn); color: var(--bg); }
    #record-btn:disabled {
      background: var(--dim);
      color: rgba(0,0,0,0.4);
      cursor: not-allowed;
    }

    /* v0.2: voice toggle row */
    #voice-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 2px 4px;
    }

    #voice-row label {
      font-size: 13px;
      color: var(--dim);
      letter-spacing: 0.3px;
    }

    #voice-toggle, #shape-toggle {
      position: relative;
      width: 44px;
      height: 26px;
      background: #3a3f3a;
      border-radius: 13px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    #voice-toggle.on, #shape-toggle.on { background: var(--accent); }

    #voice-toggle::after, #shape-toggle::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 20px; height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.15s;
    }

    #voice-toggle.on::after, #shape-toggle.on::after { transform: translateX(18px); }

    #voice-toggle.disabled, #shape-toggle.disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #result-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      padding: 24px 20px calc(env(safe-area-inset-bottom, 20px) + 20px);
      flex-direction: column;
      z-index: 10;
      overflow-y: auto;
    }

    #result-panel.visible { display: flex; }

    #result-header { text-align: center; margin-bottom: 16px; }

    #result-label {
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    #result-value {
      font-size: 56px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
    }

    #result-verdict { font-size: 16px; color: var(--fg); }
    #result-verdict.good { color: var(--accent); }
    #result-verdict.off { color: var(--warn); }
    #result-verdict.error { color: var(--error); }

    #warnings {
      margin: 12px 0;
      padding: 10px 14px;
      background: rgba(229, 168, 35, 0.12);
      border-left: 3px solid var(--warn);
      border-radius: 4px;
      font-size: 12px;
      color: var(--fg);
      display: none;
    }

    #warnings.visible { display: block; }

    #chart-section { margin: 16px 0; }

    #chart-title {
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    #chart-canvas {
      width: 100%;
      height: 180px;
      background: #1a2420;
      border-radius: 8px;
      display: block;
    }

    #chart-legend {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--dim);
      flex-wrap: wrap;
    }

    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    #diagnostics {
      background: #1a2420;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
    }

    .diag-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      color: var(--fg);
    }

    .diag-row + .diag-row { border-top: 1px solid rgba(232, 228, 216, 0.08); }
    .diag-label { color: var(--dim); }

    /* v0.2.4 */
    #last-heard-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 10px 14px;
      background: #1a2420;
      border-radius: 8px;
      margin-bottom: 10px;
      font-variant-numeric: tabular-nums;
    }
    #last-heard-row .lh-label {
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    #last-heard-row .lh-value {
      font-size: 20px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    #last-heard-row .lh-value.empty { color: var(--dim); font-weight: 400; font-size: 16px; }

    #transcript-debug {
      padding: 10px 14px;
      background: #1a2420;
      border-radius: 8px;
      margin-bottom: 16px;
      font-family: 'SF Mono', ui-monospace, monospace;
      font-size: 11px;
      color: var(--fg);
      max-height: 100px;
      overflow-y: auto;
    }
    #transcript-debug .td-label {
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    #transcript-debug .td-list .td-entry {
      padding: 2px 0;
      color: rgba(232, 228, 216, 0.75);
      line-height: 1.35;
    }
    #transcript-debug .td-list .td-entry.matched { color: var(--accent); }
    #transcript-debug .td-list .td-entry .td-tag {
      display: inline-block;
      min-width: 44px;
      color: var(--dim);
      margin-right: 6px;
    }

    #result-actions {
      display: flex;
      gap: 12px;
      margin-top: auto;
    }

    #result-close, #result-save {
      flex: 1;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid var(--fg);
      border-radius: 10px;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    #result-close {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }

    #result-close:active, #result-save:active { opacity: 0.8; }

    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 20;
    }

    #loading.hidden { display: none; }

    #loading-label {
      font-size: 14px;
      color: var(--dim);
      letter-spacing: 1px;
    }

    #loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--dim);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #error-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      padding: 32px 24px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }

    #error-panel.visible { display: flex; }

    #error-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--error);
    }

    #error-message {
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
      color: var(--fg);
      max-width: 320px;
    }

    #debug {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      font-family: 'SF Mono', monospace;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="video-container">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="rec-border"></div>
      <div id="rec-indicator">
        <div id="rec-dot"></div>
        <span>REC</span>
      </div>
      <div id="listen-indicator">
        <div id="listen-dot"></div>
        <span>say &ldquo;ready&rdquo;</span>
      </div>
      <div id="countdown">6</div>
      <div id="countdown-label">Get into your stance</div>
      <div id="shape-heard"></div>
      <div id="debug"></div>
    </div>

    <div id="controls">
      <div id="status">Tap Start, or say &ldquo;ready&rdquo;. You have 6 seconds to get into stance.</div>
      <button id="record-btn" disabled>Start</button>
      <div id="voice-row">
        <label for="voice-toggle">Voice trigger (say &ldquo;ready&rdquo;)</label>
        <div id="voice-toggle" class="on" role="switch" aria-checked="true" tabindex="0"></div>
      </div>
      <div id="voice-row">
        <label for="shape-toggle">Shape reporting (say &ldquo;pull&rdquo;, &ldquo;straight&rdquo;, &hellip;)</label>
        <div id="shape-toggle" role="switch" aria-checked="false" tabindex="0"></div>
      </div>
    </div>
  </div>

  <div id="loading">
    <div id="loading-spinner"></div>
    <div id="loading-label">Loading pose detection…</div>
  </div>

  <div id="result-panel">
    <div id="result-header">
      <div id="result-label">Tempo Ratio</div>
      <div id="result-value">—</div>
      <div id="result-verdict"></div>
    </div>

    <div id="warnings"></div>

    <div id="chart-section">
      <div id="chart-title">Wrist Height Over Time</div>
      <canvas id="chart-canvas"></canvas>
      <div id="chart-legend">
        <div class="legend-item"><div class="legend-dot" style="background: var(--address)"></div>Address</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--top)"></div>Top</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--impact)"></div>Impact</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--finish)"></div>Finish</div>
      </div>
    </div>

    <div id="diagnostics"></div>

    <div id="last-heard-row">
      <span class="lh-label">Last heard:</span>
      <span class="lh-value" id="last-heard-value">—</span>
    </div>

    <div id="transcript-debug">
      <div class="td-label">Recent transcripts (debug)</div>
      <div class="td-list" id="transcript-list"></div>
    </div>

    <div id="result-actions">
      <button id="result-save">Save Raw Data</button>
      <button id="result-close">Next Swing</button>
    </div>
  </div>

  <div id="error-panel">
    <div id="error-title">Something went wrong</div>
    <div id="error-message"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>

  <script>
    // ============================================================
    // Golf Coach v0.2.4
    //
    // Changes from v0.2.3:
    //   + Shape chime simplified to single-oscillator envelope — fixes
    //     desktop Edge silence (two-oscillator version worked on AirPods
    //     but not desktop; likely linearRamp precision issue).
    //   + "Last heard" display now inside the result panel — previously
    //     the bottom-pill and status bar were both hidden under the
    //     full-screen result panel during the waiting state.
    //   + Transcript debug log: last 3 recognized phrases shown in the
    //     result panel, so we can see what Safari actually returns and
    //     diagnose words that don't match ("straight", "bad", "pull"
    //     reported as non-triggering in v0.2.3 testing).
    //
    // Changes from v0.2.2:
    //   + Audio confirmation when a shape word is recognized — short chime
    //     so the golfer doesn't have to look at the phone to know the system
    //     heard them. Generic tone regardless of which shape (the word is
    //     written to the JSON anyway if the user wants to verify later).
    //
    // Changes from v0.2.1:
    //   + Peak detector fix: accepts flat plateaus as valid minima
    //   + Edge-aware prominence: handles peaks cut off by recording end
    //   Together these fix "Incomplete swing" false negatives.
    //
    // Changes from v0.2.0:
    //   + Hands-free session loop: recording auto-stops after RECORDING_DURATION_MS
    //   + New 'waiting' state after analysis: listens for shape words OR "ready"
    //   + Shape reporting toggle
    //
    // Unchanged from v0.2.0 / v0.1.6:
    //   - Pinned MediaPipe Pose @0.5.1675469404
    //   - Camera, pose pump, drawing, tempo analysis, chart, result UI shell
    // ============================================================

    const COUNTDOWN_SECONDS = 6;
    const MAX_SWING_MS = 4000;
    const MIN_PEAK_SEPARATION_MS = 300;
    const PRE_ADDRESS_BUFFER_MS = 300;
    const POST_FINISH_BUFFER_MS = 400;

    // v0.2 voice-trigger tunables
    const MIC_RESTART_DELAY_MS = 400;

    // v0.2.1 hands-free loop tunables
    // v0.2.2: RECORDING_DURATION_MS bumped from 3000 → 4000. 3s was too short —
    // a typical swing sequence is: settle-after-beep (~500ms) + swing-to-finish
    // (~2000ms) + hold-at-finish (~500ms) = ~3s minimum, but leaves no margin
    // for anything slower. 4000ms matches MAX_SWING_MS (the analysis window
    // length) so we're using one consistent value: "no real swing takes longer
    // than this." Real-time end-of-swing detection is a v0.3+ improvement.
    const RECORDING_DURATION_MS = 4000;        // auto-stop recording 4s after beep
    const SHAPE_HEARD_FLASH_MS   = 1400;       // how long the "heard: pull" pill shows
    const SHAPE_WORDS = ['straight', 'pull', 'push', 'hook', 'slice', 'bad'];

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const overlayCtx = overlay.getContext('2d');
    const recordBtn = document.getElementById('record-btn');
    const status = document.getElementById('status');
    const recIndicator = document.getElementById('rec-indicator');
    const recBorder = document.getElementById('rec-border');
    const countdownEl = document.getElementById('countdown');
    const countdownLabel = document.getElementById('countdown-label');
    const loading = document.getElementById('loading');
    const loadingLabel = document.getElementById('loading-label');
    const resultPanel = document.getElementById('result-panel');
    const resultValue = document.getElementById('result-value');
    const resultVerdict = document.getElementById('result-verdict');
    const warningsEl = document.getElementById('warnings');
    const diagnostics = document.getElementById('diagnostics');
    const chartCanvas = document.getElementById('chart-canvas');
    const chartCtx = chartCanvas.getContext('2d');
    const resultClose = document.getElementById('result-close');
    const resultSave = document.getElementById('result-save');
    const errorPanel = document.getElementById('error-panel');
    const errorMessage = document.getElementById('error-message');
    const debug = document.getElementById('debug');
    // v0.2 additions
    const listenIndicator = document.getElementById('listen-indicator');
    const voiceToggle = document.getElementById('voice-toggle');
    const shapeToggle = document.getElementById('shape-toggle');
    const shapeHeardEl = document.getElementById('shape-heard');
    // v0.2.4
    const lastHeardValue = document.getElementById('last-heard-value');
    const transcriptList = document.getElementById('transcript-list');

    let pose = null;
    let appState = 'idle';
    let frames = [];
    let recordingStartTime = 0;
    let beepTime = 0;
    let countdownTimer = null;
    let rafId = null;
    let lastAnalysis = null;
    let audioCtx = null;

    // v0.2 voice state
    let recognition = null;
    let recognitionRunning = false;
    let voiceEnabled = true;
    let voiceSupported = true;
    let micRestartPending = false;

    // v0.2.1 hands-free loop state
    let shapeEnabled = false;         // controlled by shape-toggle
    let recordingAutoStopTimer = null;
    let shapeHeardTimer = null;
    let pendingShape = null;          // shape captured for the most recent swing

    function showError(title, message) {
      errorPanel.querySelector('#error-title').textContent = title;
      errorMessage.textContent = message;
      errorPanel.classList.add('visible');
      loading.classList.add('hidden');
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
          audio: false
        });
        video.srcObject = stream;
        await new Promise((resolve) => {
          video.onloadedmetadata = () => { video.play(); resolve(); };
        });
        resizeOverlay();
        window.addEventListener('resize', resizeOverlay);
      } catch (e) {
        showError('Camera access denied', 'This app needs camera access. Please allow it and reload.');
        throw e;
      }
    }

    function resizeOverlay() {
      overlay.width = video.clientWidth;
      overlay.height = video.clientHeight;
    }

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.3, now + 0.02);
      gain.gain.linearRampToValueAtTime(0, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    }

    function playTick() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.12, now + 0.01);
      gain.gain.linearRampToValueAtTime(0, now + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    }

    // v0.2.3 / v0.2.4: short, neutral confirmation chime played when a shape
    // word is recognized. Single oscillator with a frequency sweep — matches
    // the envelope style of playBeep/playTick which are known to work on both
    // desktop Edge and iOS Safari. The previous two-oscillator version played
    // fine on mobile (AirPods) but was silent on desktop Edge.
    function playShapeChime() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      // Sweep from 660 Hz up to 990 Hz (perfect fifth) over the tone's length,
      // giving the "rising" feel of a confirmation chime.
      osc.frequency.setValueAtTime(660, now);
      osc.frequency.linearRampToValueAtTime(990, now + 0.14);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.2, now + 0.02);
      gain.gain.linearRampToValueAtTime(0, now + 0.16);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    }

    async function setupPose() {
      pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${file}`
      });
      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      pose.onResults(onPoseResults);
      await pose.initialize?.();
    }

    function onPoseResults(results) {
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      if (results.poseLandmarks) {
        drawSkeleton(results.poseLandmarks);
        if (appState === 'recording') {
          frames.push({
            t: performance.now() - recordingStartTime,
            landmarks: results.poseLandmarks.map(lm => ({
              x: lm.x, y: lm.y, z: lm.z, v: lm.visibility
            }))
          });
          debug.textContent = `frames: ${frames.length}`;
        }
      }
    }

    const LM = {
      NOSE: 0,
      LEFT_SHOULDER: 11, RIGHT_SHOULDER: 12,
      LEFT_ELBOW: 13, RIGHT_ELBOW: 14,
      LEFT_WRIST: 15, RIGHT_WRIST: 16,
      LEFT_HIP: 23, RIGHT_HIP: 24,
      LEFT_KNEE: 25, RIGHT_KNEE: 26,
      LEFT_ANKLE: 27, RIGHT_ANKLE: 28
    };

    const BONES = [
      [LM.LEFT_SHOULDER, LM.RIGHT_SHOULDER],
      [LM.LEFT_SHOULDER, LM.LEFT_ELBOW], [LM.LEFT_ELBOW, LM.LEFT_WRIST],
      [LM.RIGHT_SHOULDER, LM.RIGHT_ELBOW], [LM.RIGHT_ELBOW, LM.RIGHT_WRIST],
      [LM.LEFT_SHOULDER, LM.LEFT_HIP], [LM.RIGHT_SHOULDER, LM.RIGHT_HIP],
      [LM.LEFT_HIP, LM.RIGHT_HIP],
      [LM.LEFT_HIP, LM.LEFT_KNEE], [LM.LEFT_KNEE, LM.LEFT_ANKLE],
      [LM.RIGHT_HIP, LM.RIGHT_KNEE], [LM.RIGHT_KNEE, LM.RIGHT_ANKLE]
    ];

    function drawSkeleton(landmarks) {
      const w = overlay.width, h = overlay.height;
      const toX = (x) => (1 - x) * w;
      const toY = (y) => y * h;
      overlayCtx.lineWidth = 3;
      overlayCtx.strokeStyle = 'rgba(155, 197, 61, 0.85)';
      overlayCtx.fillStyle = 'rgba(232, 228, 216, 0.95)';
      for (const [a, b] of BONES) {
        const la = landmarks[a], lb = landmarks[b];
        if (la.visibility > 0.3 && lb.visibility > 0.3) {
          overlayCtx.beginPath();
          overlayCtx.moveTo(toX(la.x), toY(la.y));
          overlayCtx.lineTo(toX(lb.x), toY(lb.y));
          overlayCtx.stroke();
        }
      }
      const keyJoints = [LM.LEFT_SHOULDER, LM.RIGHT_SHOULDER, LM.LEFT_ELBOW, LM.RIGHT_ELBOW,
        LM.LEFT_WRIST, LM.RIGHT_WRIST, LM.LEFT_HIP, LM.RIGHT_HIP, LM.LEFT_KNEE, LM.RIGHT_KNEE];
      for (const idx of keyJoints) {
        const lm = landmarks[idx];
        if (lm.visibility > 0.3) {
          overlayCtx.beginPath();
          overlayCtx.arc(toX(lm.x), toY(lm.y), 4, 0, 2 * Math.PI);
          overlayCtx.fill();
        }
      }
    }

    async function pump() {
      if (video.readyState >= 2) await pose.send({ image: video });
      rafId = requestAnimationFrame(pump);
    }

    // ============================================================
    // v0.2 Voice trigger — Web Speech API
    // ============================================================

    function setupRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        voiceSupported = false;
        voiceEnabled = false;
        setVoiceToggleUI(false, true);
        return;
      }

      recognition = new SR();
      recognition.lang = 'en-US';
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 3;

      recognition.onstart = () => {
        recognitionRunning = true;
        if ((appState === 'idle' || appState === 'waiting') && voiceEnabled) {
          listenIndicator.classList.add('active');
        }
      };

      recognition.onend = () => {
        recognitionRunning = false;
        listenIndicator.classList.remove('active');
        // Auto-restart if we still want to be listening (iOS Safari silently stops on silence)
        const shouldListen = (appState === 'idle' || appState === 'waiting') && voiceEnabled;
        if (shouldListen && !micRestartPending) {
          micRestartPending = true;
          setTimeout(() => {
            micRestartPending = false;
            const stillShouldListen = (appState === 'idle' || appState === 'waiting') && voiceEnabled;
            if (stillShouldListen) startRecognition();
          }, MIC_RESTART_DELAY_MS);
        }
      };

      recognition.onerror = (e) => {
        // "no-speech", "aborted", "audio-capture" can fire during normal use — onend handles restart.
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          voiceEnabled = false;
          voiceSupported = false;
          setVoiceToggleUI(false, true);
          listenIndicator.classList.remove('active');
          status.textContent = 'Mic blocked — using tap. Tap Start.';
        }
      };

      recognition.onresult = (ev) => {
        if (!voiceEnabled) return;
        if (appState !== 'idle' && appState !== 'waiting') return;

        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const r = ev.results[i];
          // v0.2.4: log every candidate transcript to the debug panel,
          // whether it matched or not. First candidate (top alternative)
          // is what we'd normally see; we log all alternatives tagged
          // with index, to surface what Safari is actually hearing.
          const candidates = [];
          for (let a = 0; a < r.length; a++) {
            candidates.push(r[a].transcript.toLowerCase().trim());
          }

          let matchedWord = null;
          let matchedKind = null; // 'ready' | 'shape' | null

          for (let a = 0; a < r.length; a++) {
            const text = candidates[a];

            // "ready" works in both idle and waiting.
            if (matchesReady(text)) {
              matchedWord = 'ready';
              matchedKind = 'ready';
              break;
            }

            // Shape words only count in the waiting state, and only when
            // the shape toggle is on.
            if (appState === 'waiting' && shapeEnabled) {
              const shape = matchesShapeWord(text);
              if (shape) {
                matchedWord = shape;
                matchedKind = 'shape';
                break;
              }
            }
          }

          // Log to transcript debug panel (top-1 candidate with "+N alts"
          // hint if there were alternatives, plus interim/final tag).
          logTranscript({
            text: candidates[0] || '(empty)',
            altCount: candidates.length - 1,
            isFinal: r.isFinal,
            matched: matchedWord,
            matchedKind
          });

          if (matchedKind === 'ready') {
            if (appState === 'waiting') onReadyInWaitingState();
            else onVoiceReady();
            return;
          }
          if (matchedKind === 'shape') {
            onShapeHeard(matchedWord);
            return;
          }
        }
      };
    }

    // v0.2.4: rolling buffer of recent transcripts visible in the result panel.
    // Helps diagnose "word not recognized" issues by showing what the recognizer
    // actually returned — e.g. "pull" often comes back as "pole" or "pol".
    const TRANSCRIPT_HISTORY_MAX = 6;
    const transcriptHistory = [];
    function logTranscript({ text, altCount, isFinal, matched, matchedKind }) {
      transcriptHistory.unshift({ text, altCount, isFinal, matched, matchedKind });
      if (transcriptHistory.length > TRANSCRIPT_HISTORY_MAX) {
        transcriptHistory.length = TRANSCRIPT_HISTORY_MAX;
      }
      renderTranscriptHistory();
    }
    function renderTranscriptHistory() {
      if (!transcriptList) return;
      transcriptList.innerHTML = '';
      for (const entry of transcriptHistory) {
        const row = document.createElement('div');
        row.className = 'td-entry' + (entry.matched ? ' matched' : '');
        const tag = entry.isFinal ? 'final' : 'interim';
        const altsStr = entry.altCount > 0 ? ` (+${entry.altCount})` : '';
        const matchStr = entry.matched
          ? `  → ${entry.matchedKind}: ${entry.matched}`
          : '';
        row.innerHTML =
          `<span class="td-tag">${tag}</span>"${entry.text}"${altsStr}${matchStr}`;
        transcriptList.appendChild(row);
      }
    }

    function matchesReady(text) {
      // Match "ready" as a whole word. Tolerate a couple of common mishears.
      // Narrow by design — we want precision over recall on a noisy range.
      const padded = ' ' + text.replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ') + ' ';
      return / ready /.test(padded) || / reddy /.test(padded) || / redi /.test(padded);
    }

    // v0.2.1: match one of the 6 shape words as a whole word.
    // v0.2.4: expanded with common Safari mishears reported from phone testing
    // where "pull", "straight", "bad" frequently failed to match.
    function matchesShapeWord(text) {
      const padded = ' ' + text.replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ') + ' ';
      // Canonical words first.
      for (const word of SHAPE_WORDS) {
        const re = new RegExp(' ' + word + ' ');
        if (re.test(padded)) return word;
      }
      // Common mishears — conservative, each verified to be unambiguous.
      if (/ pole | poll | paul | pool | pul /.test(padded)) return 'pull';
      if (/ bat | bud | bed | bet /.test(padded))          return 'bad';
      if (/ strait | strayed | straighten /.test(padded))   return 'straight';
      if (/ hoop | hock /.test(padded))                     return 'hook';
      if (/ splice | slight /.test(padded))                 return 'slice';
      if (/ posh /.test(padded))                            return 'push';
      return null;
    }

    function onShapeHeard(word) {
      pendingShape = word;
      // Fold into lastAnalysis if it exists, so "Save Raw Data" picks it up.
      if (lastAnalysis) lastAnalysis.shape = word;
      showShapeHeardPill(word);
      // v0.2.3: audio confirmation — the golfer can't see the screen from
      // 2m away in stance. Chime says "got it, logged."
      playShapeChime();
      // v0.2.4: persistent display inside the result panel (was previously
      // hidden under the fullscreen panel).
      updateLastHeardDisplay(word);
      // Status-bar flash is kept, though it's mostly obscured by the panel
      // — still useful on very tall screens where the controls peek out.
      flashStatusShapeHeard(word);
    }

    function updateLastHeardDisplay(word) {
      if (!lastHeardValue) return;
      if (word) {
        lastHeardValue.textContent = word;
        lastHeardValue.classList.remove('empty');
      } else {
        lastHeardValue.textContent = '—';
        lastHeardValue.classList.add('empty');
      }
    }

    function showShapeHeardPill(word) {
      shapeHeardEl.textContent = 'heard: ' + word;
      shapeHeardEl.classList.add('visible');
      if (shapeHeardTimer) clearTimeout(shapeHeardTimer);
      shapeHeardTimer = setTimeout(() => {
        shapeHeardEl.classList.remove('visible');
      }, SHAPE_HEARD_FLASH_MS);
    }

    // v0.2.3: briefly replace status text with "heard: <word>" then restore
    // the waiting-state hint so the next swing prompt is clear again.
    let statusRestoreTimer = null;
    function flashStatusShapeHeard(word) {
      status.textContent = 'heard: ' + word + '  —  say "ready" for next swing';
      if (statusRestoreTimer) clearTimeout(statusRestoreTimer);
      statusRestoreTimer = setTimeout(() => {
        statusRestoreTimer = null;
        if (appState === 'waiting') {
          status.textContent = shapeEnabled
            ? 'Say the shape (pull, straight, …) or “ready” for next swing.'
            : 'Say “ready” for next swing, or tap Next Swing.';
        }
      }, SHAPE_HEARD_FLASH_MS);
    }

    function onReadyInWaitingState() {
      // "ready" while the result panel is showing means: we're done reviewing,
      // start the next swing. Dismiss the panel and go straight into countdown.
      // pendingShape (if any) was already captured in lastAnalysis.
      stopRecognition();
      listenIndicator.classList.remove('active');
      resultPanel.classList.remove('visible');
      startCountdown();
    }

    function startRecognition() {
      if (!recognition || !voiceEnabled) return;
      // Don't gate on recognitionRunning — the flag can lag reality on mobile.
      // Just try to start; if it's already running, catch the InvalidStateError.
      try {
        recognition.start();
      } catch (e) {
        // "InvalidStateError" means it's already started — benign, ignore.
        // Anything else: log to debug so we can see it on device.
        if (e && e.name !== 'InvalidStateError') {
          debug.textContent = 'rec.start err: ' + e.name;
        }
      }
    }

    function stopRecognition() {
      if (!recognition || !recognitionRunning) return;
      try { recognition.stop(); } catch (_) {}
    }

    function onVoiceReady() {
      stopRecognition();
      listenIndicator.classList.remove('active');
      startCountdown();
    }

    function setVoiceToggleUI(on, disabled) {
      voiceToggle.classList.toggle('on', on);
      voiceToggle.setAttribute('aria-checked', on ? 'true' : 'false');
      voiceToggle.classList.toggle('disabled', !!disabled);
    }

    function enableVoice() {
      if (!voiceSupported) return;
      voiceEnabled = true;
      setVoiceToggleUI(true, false);
      if (appState === 'idle') startRecognition();
    }

    function disableVoice() {
      voiceEnabled = false;
      setVoiceToggleUI(false, false);
      stopRecognition();
      listenIndicator.classList.remove('active');
    }

    // ============================================================
    // Countdown / recording (from v0.1.6, with voice-pause hooks)
    // ============================================================

    function startCountdown() {
      ensureAudio();
      stopRecognition(); // v0.2: don't listen during countdown
      listenIndicator.classList.remove('active');
      // v0.2.1: if we came from waiting state, clear residual UI
      resultPanel.classList.remove('visible');
      shapeHeardEl.classList.remove('visible');
      if (shapeHeardTimer) { clearTimeout(shapeHeardTimer); shapeHeardTimer = null; }
      appState = 'counting';
      let remaining = COUNTDOWN_SECONDS;
      recordBtn.textContent = `${remaining}…`;
      recordBtn.classList.add('counting');
      recordBtn.disabled = true;
      countdownEl.textContent = remaining;
      countdownEl.classList.add('active');
      countdownLabel.style.display = 'block';
      recBorder.classList.add('countdown');
      status.textContent = 'Get into your stance. Swing when the beep plays.';
      playTick();
      countdownTimer = setInterval(() => {
        remaining--;
        if (remaining > 0) {
          recordBtn.textContent = `${remaining}…`;
          countdownEl.textContent = remaining;
          playTick();
        } else {
          clearInterval(countdownTimer);
          countdownTimer = null;
          countdownEl.classList.remove('active');
          countdownLabel.style.display = 'none';
          recBorder.classList.remove('countdown');
          beginRecording();
        }
      }, 1000);
    }

    function beginRecording() {
      playBeep();
      frames = [];
      recordingStartTime = performance.now();
      beepTime = 0;
      pendingShape = null;
      updateLastHeardDisplay(null); // v0.2.4: reset for the new swing
      appState = 'recording';
      recordBtn.textContent = 'Stop';
      recordBtn.classList.remove('counting');
      recordBtn.classList.add('recording');
      recordBtn.disabled = false;
      recIndicator.classList.add('active');
      recBorder.classList.add('active');
      status.textContent = `Recording… (auto-stops in ${(RECORDING_DURATION_MS/1000).toFixed(0)}s)`;

      // v0.2.1: auto-stop the recording. This is what makes the session hands-free.
      // Tap Stop still works — it fires stopRecording early and clears the timer.
      if (recordingAutoStopTimer) clearTimeout(recordingAutoStopTimer);
      recordingAutoStopTimer = setTimeout(() => {
        recordingAutoStopTimer = null;
        if (appState === 'recording') stopRecording();
      }, RECORDING_DURATION_MS);
    }

    function stopRecording() {
      // Clear any pending auto-stop timer — safe whether called by timer or user.
      if (recordingAutoStopTimer) {
        clearTimeout(recordingAutoStopTimer);
        recordingAutoStopTimer = null;
      }
      appState = 'idle';
      recordBtn.textContent = 'Start';
      recordBtn.classList.remove('recording');
      recIndicator.classList.remove('active');
      recBorder.classList.remove('active');
      status.textContent = 'Analyzing…';
      debug.textContent = '';
      setTimeout(analyze, 50);
    }

    // --- Peak finder (local minima of wristY = hands high) -------------------
    // v0.2.2: plateau-tolerant local-minimum detector with edge-aware prominence.
    //
    // Two bugs in v0.2.1 combined to cause "Incomplete swing" on real swings
    // whose Finish was a plateau (hands held high at end of swing) or was
    // truncated by the end of the recording buffer:
    //
    // 1) The previous strict "<" both-neighbors check rejected any plateau
    //    where consecutive frames had equal wristY. Finish positions are
    //    often plateaus. We now accept a frame as a minimum if the nearest
    //    non-equal neighbors on each side are both strictly higher (or run
    //    off the edge of the array). Plateau de-duplication keeps only the
    //    first frame of a flat stretch.
    //
    // 2) The previous prominence check scanned outward until it found a
    //    value LOWER than the peak; if the scan ran off the end while
    //    collecting a rising slope (e.g. the Finish plateau extends to
    //    end-of-recording) the prominence was still computed correctly
    //    using the max seen — BUT if the global minimum of the window was
    //    the Top itself, both scans ran off the edge and the old code
    //    computed Math.min(leftMax, rightMax) which for the Finish-
    //    plateau-truncated case underestimated prominence. We now only
    //    bail out to prom=0 when a side is truly flat-or-falling from
    //    the peak (i.e. its running max never exceeded y[p]) — a side
    //    that rose significantly before running off the edge is a valid
    //    basin wall for prominence purposes.
    function findPeaks(y, minProminence) {
      const n = y.length;
      const peaks = [];
      for (let i = 1; i < n - 1; i++) {
        // find nearest left and right neighbors with different y
        let left = i - 1;
        while (left >= 0 && y[left] === y[i]) left--;
        let right = i + 1;
        while (right < n && y[right] === y[i]) right++;
        const leftHigher  = (left < 0)  || y[left]  > y[i];
        const rightHigher = (right >= n) || y[right] > y[i];
        if (!leftHigher || !rightHigher) continue;
        // dedupe plateaus: only keep first frame
        if (i > 0 && y[i - 1] === y[i]) continue;
        peaks.push(i);
      }

      const prominent = [];
      for (const p of peaks) {
        // Walk left from peak, tracking the highest value seen, until we
        // find a value lower than the peak (meaning we've descended out
        // of this peak's basin).
        let leftMax = y[p];
        let leftSawHigher = false;
        for (let i = p - 1; i >= 0; i--) {
          if (y[i] < y[p]) break;
          if (y[i] > leftMax) { leftMax = y[i]; leftSawHigher = true; }
        }
        // Same to the right.
        let rightMax = y[p];
        let rightSawHigher = false;
        for (let i = p + 1; i < n; i++) {
          if (y[i] < y[p]) break;
          if (y[i] > rightMax) { rightMax = y[i]; rightSawHigher = true; }
        }

        // Prominence:
        // - If both sides rose above the peak, standard prominence: the
        //   smaller of the two rises bounds how deep this basin is.
        // - If only ONE side rose (e.g. a peak at the very end of the
        //   recording where the right side was cut off), use that side's
        //   rise alone. This is the key fix for Finish peaks on truncated
        //   recordings.
        // - If NEITHER side rose, the "peak" is just a flat or descending
        //   trace — reject.
        let prom;
        if (leftSawHigher && rightSawHigher) {
          prom = Math.min(leftMax, rightMax) - y[p];
        } else if (leftSawHigher) {
          prom = leftMax - y[p];
        } else if (rightSawHigher) {
          prom = rightMax - y[p];
        } else {
          prom = 0;
        }

        if (prom >= minProminence) {
          prominent.push({ idx: p, value: y[p], prominence: prom });
        }
      }
      return prominent;
    }

    function smooth(arr, window) {
      const out = [];
      const half = Math.floor(window / 2);
      for (let i = 0; i < arr.length; i++) {
        let s = 0, c = 0;
        for (let j = Math.max(0, i - half); j <= Math.min(arr.length - 1, i + half); j++) {
          s += arr[j]; c++;
        }
        out.push(s / c);
      }
      return out;
    }

    // --- Main analysis -------------------------------------------------------
    function analyze() {
      if (frames.length < 15) {
        showResult({
          value: '—', verdict: 'Too short', verdictClass: 'error',
          wristY: [],
          addressIdx: null, topIdx: null, impactIdx: null, finishIdx: null,
          diag: [['Frames captured', frames.length]],
          warnings: []
        });
        return;
      }

      const HIGH_CONF = 0.7;
      const LOW_CONF = 0.5;
      const rawY = frames.map(f => {
        const lw = f.landmarks[LM.LEFT_WRIST];
        const rw = f.landmarks[LM.RIGHT_WRIST];
        const lOk = lw.v >= HIGH_CONF;
        const rOk = rw.v >= HIGH_CONF;
        if (lOk && rOk) return (lw.y + rw.y) / 2;
        if (lOk) return lw.y;
        if (rOk) return rw.y;
        if (lw.v >= LOW_CONF && lw.v >= rw.v) return lw.y;
        if (rw.v >= LOW_CONF && rw.v > lw.v) return rw.y;
        return null;
      });
      let lastY = null;
      for (let i = 0; i < rawY.length; i++) {
        if (rawY[i] == null) rawY[i] = lastY;
        else lastY = rawY[i];
      }
      let firstY = rawY.find(y => y != null);
      if (firstY == null) {
        showResult({
          value: '—', verdict: 'No pose detected', verdictClass: 'error',
          wristY: [], addressIdx: null, topIdx: null, impactIdx: null, finishIdx: null,
          diag: [['Frames captured', frames.length], ['Pose detected in', '0 frames']],
          warnings: []
        });
        return;
      }
      for (let i = 0; i < rawY.length; i++) {
        if (rawY[i] == null) rawY[i] = firstY;
      }

      const smoothed = smooth(rawY, 5);

      const MOTION_CONFIRM = 5;
      const MIN_MOTION_PER_FRAME = 0.005;
      let addressIdx = 0;
      for (let i = 0; i < smoothed.length - MOTION_CONFIRM; i++) {
        const futureDrop = smoothed[i] - smoothed[i + MOTION_CONFIRM];
        if (futureDrop < MIN_MOTION_PER_FRAME * MOTION_CONFIRM) {
          addressIdx = i;
        } else {
          break;
        }
      }

      const tAddress = frames[addressIdx].t;
      const winEndT = tAddress + MAX_SWING_MS;
      let winEndIdx = frames.length - 1;
      for (let i = 0; i < frames.length; i++) {
        if (frames[i].t > winEndT) { winEndIdx = i - 1; break; }
      }

      if (winEndIdx <= addressIdx + 5) {
        showResult({
          value: '—', verdict: 'Recording too short', verdictClass: 'error',
          wristY: smoothed,
          addressIdx, topIdx: null, impactIdx: null, finishIdx: null,
          diag: [
            ['Frames captured', frames.length],
            ['Address frame', addressIdx],
            ['Window size', `${winEndIdx - addressIdx} frames`]
          ],
          warnings: ['Recording was too short — no swing was captured before it ended.']
        });
        return;
      }

      const windowSlice = smoothed.slice(addressIdx, winEndIdx + 1);
      const windowRange = Math.max(...windowSlice) - Math.min(...windowSlice);
      const minProminence = Math.max(0.04, windowRange * 0.15);
      const rawPeaks = findPeaks(windowSlice, minProminence)
        .map(p => ({ idx: p.idx + addressIdx, value: p.value, prominence: p.prominence }));

      const mergedPeaks = [];
      for (const p of rawPeaks) {
        const last = mergedPeaks[mergedPeaks.length - 1];
        if (last && frames[p.idx].t - frames[last.idx].t < MIN_PEAK_SEPARATION_MS) {
          if (p.value < last.value) mergedPeaks[mergedPeaks.length - 1] = p;
        } else {
          mergedPeaks.push(p);
        }
      }

      const warnings = [];

      if (mergedPeaks.length < 2) {
        showResult({
          value: '—', verdict: 'Incomplete swing', verdictClass: 'error',
          wristY: smoothed,
          addressIdx, topIdx: mergedPeaks[0]?.idx ?? null,
          impactIdx: null, finishIdx: null,
          diag: [
            ['Frames captured', frames.length],
            ['Prominent peaks', rawPeaks.length],
            ['Peaks after merging close ones', mergedPeaks.length]
          ],
          warnings: ['Not a full swing — swing all the way through to the finish position.']
        });
        return;
      }

      if (mergedPeaks.length > 2) {
        warnings.push(`Detected ${mergedPeaks.length} distinct peaks — used the first two. If you made extra motions, try one clean swing.`);
      }

      const topIdx = mergedPeaks[0].idx;
      const finishIdx = mergedPeaks[1].idx;

      let impactIdx = topIdx + 1;
      for (let i = topIdx + 1; i < finishIdx; i++) {
        if (smoothed[i] > smoothed[impactIdx]) impactIdx = i;
      }

      const chartStartT = tAddress - PRE_ADDRESS_BUFFER_MS;
      const chartEndT = frames[finishIdx].t + POST_FINISH_BUFFER_MS;
      let clipStart = 0, clipEnd = frames.length - 1;
      for (let i = 0; i < frames.length; i++) {
        if (frames[i].t <= chartStartT) clipStart = i;
      }
      for (let i = frames.length - 1; i >= 0; i--) {
        if (frames[i].t >= chartEndT) clipEnd = i;
      }
      if (clipEnd <= clipStart) { clipStart = 0; clipEnd = frames.length - 1; }

      const clippedY = smoothed.slice(clipStart, clipEnd + 1);
      const clippedFrames = frames.slice(clipStart, clipEnd + 1);

      const cAddress = addressIdx - clipStart;
      const cTop = topIdx - clipStart;
      const cImpact = impactIdx - clipStart;
      const cFinish = finishIdx - clipStart;

      const tTop = frames[topIdx].t;
      const tImpact = frames[impactIdx].t;
      const tFinish = frames[finishIdx].t;
      const backswingMs = tTop - tAddress;
      const downswingMs = tImpact - tTop;
      const totalMs = frames[frames.length - 1].t;
      const fps = frames.length / (totalMs / 1000);
      const beepToAddressMs = tAddress - beepTime;
      const clippedDurationMs = clippedFrames[clippedFrames.length - 1].t - clippedFrames[0].t;

      const diag = [
        ['Frames captured', frames.length],
        ['Recording duration', `${(totalMs/1000).toFixed(2)} s`],
        ['Effective FPS', fps.toFixed(1)],
        ['Analyzed window', `${(clippedDurationMs/1000).toFixed(2)} s`],
        ['Beep → motion onset', `${beepToAddressMs.toFixed(0)} ms`],
        ['Address', `frame ${addressIdx} (${tAddress.toFixed(0)} ms)`],
        ['Top', `frame ${topIdx} (${tTop.toFixed(0)} ms)`],
        ['Impact', `frame ${impactIdx} (${tImpact.toFixed(0)} ms)`],
        ['Finish', `frame ${finishIdx} (${tFinish.toFixed(0)} ms)`],
        ['Backswing', `${backswingMs.toFixed(0)} ms`],
        ['Downswing', `${downswingMs.toFixed(0)} ms`],
        ['Raw peaks detected', rawPeaks.length],
        ['Peaks after merging', mergedPeaks.length],
        ['Wrist rise', (smoothed[addressIdx] - smoothed[topIdx]).toFixed(3)]
      ];

      let ratioValue = '—';
      let verdict = '';
      let verdictClass = '';

      if (backswingMs <= 0 || downswingMs <= 0) {
        verdict = 'Detection failed';
        verdictClass = 'error';
      } else if (smoothed[addressIdx] - smoothed[topIdx] < 0.08) {
        verdict = 'No swing detected';
        verdictClass = 'error';
      } else {
        const ratio = backswingMs / downswingMs;
        ratioValue = `${ratio.toFixed(1)}:1`;
        if (ratio < 2.0) { verdict = 'Backswing too fast'; verdictClass = 'off'; }
        else if (ratio > 4.0) { verdict = 'Downswing too slow'; verdictClass = 'off'; }
        else if (ratio < 2.5 || ratio > 3.5) { verdict = 'A little off 3:1'; verdictClass = 'off'; }
        else { verdict = 'In range'; verdictClass = 'good'; }
      }

      showResult({
        value: ratioValue, verdict, verdictClass,
        wristY: clippedY,
        addressIdx: cAddress, topIdx: cTop, impactIdx: cImpact, finishIdx: cFinish,
        diag, warnings
      });
    }

    // --- Chart ---------------------------------------------------------------
    function drawChart(wristY, addressIdx, topIdx, impactIdx, finishIdx) {
      const dpr = window.devicePixelRatio || 1;
      const rect = chartCanvas.getBoundingClientRect();
      chartCanvas.width = rect.width * dpr;
      chartCanvas.height = rect.height * dpr;
      chartCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      chartCtx.clearRect(0, 0, rect.width, rect.height);

      const w = rect.width, h = rect.height;
      const padX = 8, padY = 16;
      const plotW = w - 2 * padX, plotH = h - 2 * padY;

      if (wristY.length < 2) {
        chartCtx.fillStyle = 'rgba(232, 228, 216, 0.4)';
        chartCtx.font = '12px -apple-system, sans-serif';
        chartCtx.textAlign = 'center';
        chartCtx.fillText('Not enough data', w / 2, h / 2);
        return;
      }

      const minY = Math.min(...wristY);
      const maxY = Math.max(...wristY);
      const range = Math.max(0.05, maxY - minY);
      const toPx = (idx) => padX + (idx / (wristY.length - 1)) * plotW;
      const toPy = (y) => padY + ((y - minY) / range) * plotH;

      if (addressIdx != null && addressIdx >= 0 && addressIdx < wristY.length) {
        chartCtx.strokeStyle = 'rgba(232, 228, 216, 0.08)';
        chartCtx.lineWidth = 1;
        chartCtx.beginPath();
        chartCtx.moveTo(padX, toPy(wristY[addressIdx]));
        chartCtx.lineTo(padX + plotW, toPy(wristY[addressIdx]));
        chartCtx.stroke();
      }

      chartCtx.strokeStyle = 'rgba(155, 197, 61, 0.9)';
      chartCtx.lineWidth = 2;
      chartCtx.beginPath();
      for (let i = 0; i < wristY.length; i++) {
        const px = toPx(i), py = toPy(wristY[i]);
        if (i === 0) chartCtx.moveTo(px, py);
        else chartCtx.lineTo(px, py);
      }
      chartCtx.stroke();

      const events = [
        { idx: addressIdx, color: '#5dade2', label: 'A' },
        { idx: topIdx, color: '#af7ac5', label: 'T' },
        { idx: impactIdx, color: '#f39c12', label: 'I' },
        { idx: finishIdx, color: '#ec87c0', label: 'F' }
      ];

      for (const ev of events) {
        if (ev.idx == null || ev.idx < 0 || ev.idx >= wristY.length) continue;
        const px = toPx(ev.idx);
        const py = toPy(wristY[ev.idx]);
        chartCtx.strokeStyle = ev.color + '66';
        chartCtx.lineWidth = 1;
        chartCtx.setLineDash([3, 3]);
        chartCtx.beginPath();
        chartCtx.moveTo(px, padY);
        chartCtx.lineTo(px, padY + plotH);
        chartCtx.stroke();
        chartCtx.setLineDash([]);
        chartCtx.fillStyle = ev.color;
        chartCtx.beginPath();
        chartCtx.arc(px, py, 5, 0, 2 * Math.PI);
        chartCtx.fill();
        chartCtx.fillStyle = ev.color;
        chartCtx.font = 'bold 10px -apple-system, sans-serif';
        chartCtx.textAlign = 'center';
        chartCtx.fillText(ev.label, px, padY - 4);
      }
    }

    function showResult({ value, verdict, verdictClass, wristY, addressIdx, topIdx, impactIdx, finishIdx, diag, warnings }) {
      resultValue.textContent = value;
      resultVerdict.textContent = verdict;
      resultVerdict.className = '';
      if (verdictClass) resultVerdict.classList.add(verdictClass);

      if (warnings && warnings.length > 0) {
        warningsEl.innerHTML = warnings.map(w => `<div>⚠ ${w}</div>`).join('');
        warningsEl.classList.add('visible');
      } else {
        warningsEl.classList.remove('visible');
      }

      diagnostics.innerHTML = '';
      for (const [label, val] of diag) {
        const row = document.createElement('div');
        row.className = 'diag-row';
        row.innerHTML = `<span class="diag-label">${label}</span><span>${val}</span>`;
        diagnostics.appendChild(row);
      }
      resultPanel.classList.add('visible');
      requestAnimationFrame(() => {
        drawChart(wristY, addressIdx, topIdx, impactIdx, finishIdx);
      });

      lastAnalysis = {
        version: '0.2.4',
        timestamp: new Date().toISOString(),
        value, verdict,
        shape: pendingShape,         // v0.2.1: populated later if user calls out a shape
        addressIdx, topIdx, impactIdx, finishIdx,
        wristY,
        frames: frames.map(f => ({
          t: f.t,
          leftWrist: f.landmarks[LM.LEFT_WRIST],
          rightWrist: f.landmarks[LM.RIGHT_WRIST],
          leftHip: f.landmarks[LM.LEFT_HIP],
          rightHip: f.landmarks[LM.RIGHT_HIP],
          leftShoulder: f.landmarks[LM.LEFT_SHOULDER],
          rightShoulder: f.landmarks[LM.RIGHT_SHOULDER],
          nose: f.landmarks[LM.NOSE]
        }))
      };

      // v0.2.1: enter the 'waiting' state — recognition listens for shape
      // words OR "ready" to start the next swing. This is what makes the
      // session hands-free across multiple swings.
      appState = 'waiting';
      if (voiceEnabled) {
        const hint = shapeEnabled
          ? 'Say the shape (pull, straight, …) or “ready” for next swing.'
          : 'Say “ready” for next swing, or tap Next Swing.';
        status.textContent = hint;
        startRecognition();
      } else {
        status.textContent = 'Tap Next Swing when ready.';
      }
    }

    function saveRawData() {
      if (!lastAnalysis) return;
      const json = JSON.stringify(lastAnalysis, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      a.href = url;
      a.download = `swing-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    recordBtn.addEventListener('click', () => {
      ensureAudio();
      if (appState === 'idle') {
        startCountdown();
      } else if (appState === 'waiting') {
        // same behavior as "Next Swing" — panel may be open
        resultPanel.classList.remove('visible');
        startCountdown();
      } else if (appState === 'recording') {
        stopRecording();
      }
    });

    resultClose.addEventListener('click', () => {
      // "Next Swing" — close panel and go straight into countdown, same as
      // saying "ready" in the waiting state.
      resultPanel.classList.remove('visible');
      if (appState === 'waiting') {
        startCountdown();
      } else if (appState === 'idle' && voiceEnabled) {
        startRecognition();
      }
    });

    resultSave.addEventListener('click', saveRawData);

    voiceToggle.addEventListener('click', () => {
      if (!voiceSupported) return;
      if (voiceEnabled) disableVoice();
      else enableVoice();
    });
    voiceToggle.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); voiceToggle.click(); }
    });

    // v0.2.1: shape toggle — purely local state, affects onresult routing.
    shapeToggle.addEventListener('click', () => {
      shapeEnabled = !shapeEnabled;
      shapeToggle.classList.toggle('on', shapeEnabled);
      shapeToggle.setAttribute('aria-checked', shapeEnabled ? 'true' : 'false');
    });
    shapeToggle.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); shapeToggle.click(); }
    });

    (async function boot() {
      try {
        loadingLabel.textContent = 'Requesting camera…';
        await startCamera();
        loadingLabel.textContent = 'Loading pose detection…';
        await setupPose();
        pump();
        setupRecognition();
        loading.classList.add('hidden');
        recordBtn.disabled = false;
        if (voiceSupported) {
          status.textContent = 'Tap Start or say “ready”. You have 6 seconds to get into stance.';
          startRecognition();
        } else {
          setVoiceToggleUI(false, true);
          status.textContent = 'Voice not supported. Tap Start. You have 6 seconds to get into stance.';
        }
      } catch (e) {
        console.error(e);
        if (!errorPanel.classList.contains('visible')) {
          showError('Startup failed', e.message || 'Could not start the app.');
        }
      }
    })();
  </script>
</body>
</html>
