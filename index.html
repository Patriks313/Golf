<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Golf Coach — v0.1</title>
  <style>
    :root {
      --bg: #0f1712;
      --fg: #e8e4d8;
      --dim: #8a8778;
      --accent: #9bc53d;
      --warn: #e5a823;
      --error: #d95f43;
      --rec: #e74c3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    #video-container {
      position: relative;
      flex: 1;
      background: #000;
      overflow: hidden;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Mirror the front camera so it feels natural */
      transform: scaleX(-1);
    }

    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Recording indicator */
    #rec-indicator {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #rec-indicator.active { display: flex; }

    #rec-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--rec);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Recording border */
    #rec-border {
      position: absolute;
      inset: 0;
      border: 4px solid transparent;
      pointer-events: none;
      transition: border-color 0.2s;
    }

    #rec-border.active { border-color: var(--rec); }

    /* Bottom control panel */
    #controls {
      padding: 16px 20px calc(env(safe-area-inset-bottom, 16px) + 16px);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #status {
      text-align: center;
      font-size: 14px;
      color: var(--dim);
      min-height: 20px;
      letter-spacing: 0.3px;
    }

    #record-btn {
      width: 100%;
      padding: 20px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: var(--bg);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    #record-btn:active { transform: scale(0.98); }
    #record-btn.recording { background: var(--rec); color: #fff; }
    #record-btn:disabled {
      background: var(--dim);
      color: rgba(0,0,0,0.4);
      cursor: not-allowed;
    }

    /* Result display */
    #result-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 18, 0.96);
      padding: 32px 24px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    #result-panel.visible { display: flex; }

    #result-label {
      font-size: 14px;
      color: var(--dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    #result-value {
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 12px;
      font-variant-numeric: tabular-nums;
    }

    #result-verdict {
      font-size: 20px;
      margin-bottom: 32px;
      color: var(--fg);
    }

    #result-verdict.good { color: var(--accent); }
    #result-verdict.off { color: var(--warn); }
    #result-verdict.error { color: var(--error); }

    #result-detail {
      font-size: 13px;
      color: var(--dim);
      text-align: center;
      line-height: 1.6;
      max-width: 320px;
      margin-bottom: 32px;
      font-variant-numeric: tabular-nums;
    }

    #result-close {
      padding: 14px 40px;
      font-size: 16px;
      font-weight: 600;
      border: 1px solid var(--fg);
      border-radius: 10px;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    #result-close:active { background: rgba(232, 228, 216, 0.1); }

    /* Loading / progress screen */
    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 20;
    }

    #loading.hidden { display: none; }

    #loading-label {
      font-size: 14px;
      color: var(--dim);
      letter-spacing: 1px;
    }

    #loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--dim);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error panel */
    #error-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      padding: 32px 24px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }

    #error-panel.visible { display: flex; }

    #error-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--error);
    }

    #error-message {
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
      color: var(--fg);
      max-width: 320px;
    }

    /* Debug line */
    #debug {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      font-family: 'SF Mono', monospace;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="video-container">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="rec-border"></div>
      <div id="rec-indicator">
        <div id="rec-dot"></div>
        <span>REC</span>
      </div>
      <div id="debug"></div>
    </div>

    <div id="controls">
      <div id="status">Tap Start, take your stance, swing, tap Stop.</div>
      <button id="record-btn" disabled>Start</button>
    </div>
  </div>

  <div id="loading">
    <div id="loading-spinner"></div>
    <div id="loading-label">Loading pose detection…</div>
  </div>

  <div id="result-panel">
    <div id="result-label">Tempo Ratio</div>
    <div id="result-value">—</div>
    <div id="result-verdict"></div>
    <div id="result-detail"></div>
    <button id="result-close">Next Swing</button>
  </div>

  <div id="error-panel">
    <div id="error-title">Something went wrong</div>
    <div id="error-message"></div>
  </div>

  <!-- MediaPipe Pose from Google's CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>

  <script>
    // ============================================================
    // Golf Coach v0.1 — tempo-only, front camera, single-swing
    // ============================================================

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const overlayCtx = overlay.getContext('2d');
    const recordBtn = document.getElementById('record-btn');
    const status = document.getElementById('status');
    const recIndicator = document.getElementById('rec-indicator');
    const recBorder = document.getElementById('rec-border');
    const loading = document.getElementById('loading');
    const loadingLabel = document.getElementById('loading-label');
    const resultPanel = document.getElementById('result-panel');
    const resultValue = document.getElementById('result-value');
    const resultVerdict = document.getElementById('result-verdict');
    const resultDetail = document.getElementById('result-detail');
    const resultClose = document.getElementById('result-close');
    const errorPanel = document.getElementById('error-panel');
    const errorMessage = document.getElementById('error-message');
    const debug = document.getElementById('debug');

    let pose = null;
    let isRecording = false;
    let frames = []; // each: {t, landmarks}
    let recordingStartTime = 0;
    let rafId = null;

    // --- Error handling ------------------------------------------------------
    function showError(title, message) {
      errorPanel.querySelector('#error-title').textContent = title;
      errorMessage.textContent = message;
      errorPanel.classList.add('visible');
      loading.classList.add('hidden');
    }

    // --- Camera setup --------------------------------------------------------
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user', // Front camera
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 30 }
          },
          audio: false
        });
        video.srcObject = stream;
        await new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          };
        });
        // Size the overlay canvas to match video
        resizeOverlay();
        window.addEventListener('resize', resizeOverlay);
      } catch (e) {
        showError(
          'Camera access denied',
          'This app needs camera access to analyze your swing. Please allow camera access in Safari settings and reload the page.'
        );
        throw e;
      }
    }

    function resizeOverlay() {
      overlay.width = video.clientWidth;
      overlay.height = video.clientHeight;
    }

    // --- MediaPipe Pose setup ------------------------------------------------
    async function setupPose() {
      loadingLabel.textContent = 'Loading pose detection…';
      pose = new Pose({
        locateFile: (file) => {
          return `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${file}`;
        }
      });
      pose.setOptions({
        modelComplexity: 1,        // 0=lite, 1=full, 2=heavy
        smoothLandmarks: true,
        enableSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      pose.onResults(onPoseResults);
      // Warm up with a dummy frame
      await pose.initialize?.();
    }

    // --- Pose results handler ------------------------------------------------
    function onPoseResults(results) {
      // Draw skeleton to overlay (so user sees they're being tracked)
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      if (results.poseLandmarks) {
        drawSkeleton(results.poseLandmarks);
        // If recording, store this frame
        if (isRecording) {
          frames.push({
            t: performance.now() - recordingStartTime,
            landmarks: results.poseLandmarks.map(lm => ({
              x: lm.x, y: lm.y, z: lm.z, v: lm.visibility
            }))
          });
          debug.textContent = `frames: ${frames.length}`;
        }
      }
    }

    // --- Drawing helpers -----------------------------------------------------
    // Indices for MediaPipe Pose landmarks
    const LM = {
      NOSE: 0,
      LEFT_SHOULDER: 11, RIGHT_SHOULDER: 12,
      LEFT_ELBOW: 13, RIGHT_ELBOW: 14,
      LEFT_WRIST: 15, RIGHT_WRIST: 16,
      LEFT_HIP: 23, RIGHT_HIP: 24,
      LEFT_KNEE: 25, RIGHT_KNEE: 26,
      LEFT_ANKLE: 27, RIGHT_ANKLE: 28
    };

    const BONES = [
      [LM.LEFT_SHOULDER, LM.RIGHT_SHOULDER],
      [LM.LEFT_SHOULDER, LM.LEFT_ELBOW], [LM.LEFT_ELBOW, LM.LEFT_WRIST],
      [LM.RIGHT_SHOULDER, LM.RIGHT_ELBOW], [LM.RIGHT_ELBOW, LM.RIGHT_WRIST],
      [LM.LEFT_SHOULDER, LM.LEFT_HIP], [LM.RIGHT_SHOULDER, LM.RIGHT_HIP],
      [LM.LEFT_HIP, LM.RIGHT_HIP],
      [LM.LEFT_HIP, LM.LEFT_KNEE], [LM.LEFT_KNEE, LM.LEFT_ANKLE],
      [LM.RIGHT_HIP, LM.RIGHT_KNEE], [LM.RIGHT_KNEE, LM.RIGHT_ANKLE]
    ];

    function drawSkeleton(landmarks) {
      const w = overlay.width;
      const h = overlay.height;
      // The video is mirrored (scaleX(-1)), so we mirror the landmarks to match
      const toX = (x) => (1 - x) * w;
      const toY = (y) => y * h;

      overlayCtx.lineWidth = 3;
      overlayCtx.strokeStyle = 'rgba(155, 197, 61, 0.85)';
      overlayCtx.fillStyle = 'rgba(232, 228, 216, 0.95)';

      // Draw bones
      for (const [a, b] of BONES) {
        const la = landmarks[a], lb = landmarks[b];
        if (la.visibility > 0.3 && lb.visibility > 0.3) {
          overlayCtx.beginPath();
          overlayCtx.moveTo(toX(la.x), toY(la.y));
          overlayCtx.lineTo(toX(lb.x), toY(lb.y));
          overlayCtx.stroke();
        }
      }
      // Draw joints
      const keyJoints = [
        LM.LEFT_SHOULDER, LM.RIGHT_SHOULDER, LM.LEFT_ELBOW, LM.RIGHT_ELBOW,
        LM.LEFT_WRIST, LM.RIGHT_WRIST, LM.LEFT_HIP, LM.RIGHT_HIP,
        LM.LEFT_KNEE, LM.RIGHT_KNEE
      ];
      for (const idx of keyJoints) {
        const lm = landmarks[idx];
        if (lm.visibility > 0.3) {
          overlayCtx.beginPath();
          overlayCtx.arc(toX(lm.x), toY(lm.y), 4, 0, 2 * Math.PI);
          overlayCtx.fill();
        }
      }
    }

    // --- Frame pump: feed video frames to MediaPipe --------------------------
    async function pump() {
      if (video.readyState >= 2) {
        await pose.send({ image: video });
      }
      rafId = requestAnimationFrame(pump);
    }

    // --- Recording control ---------------------------------------------------
    function startRecording() {
      frames = [];
      recordingStartTime = performance.now();
      isRecording = true;
      recordBtn.textContent = 'Stop';
      recordBtn.classList.add('recording');
      recIndicator.classList.add('active');
      recBorder.classList.add('active');
      status.textContent = 'Recording… tap Stop after your swing.';
    }

    function stopRecording() {
      isRecording = false;
      recordBtn.textContent = 'Start';
      recordBtn.classList.remove('recording');
      recIndicator.classList.remove('active');
      recBorder.classList.remove('active');
      status.textContent = 'Analyzing…';
      debug.textContent = '';
      // Analyze on next tick so UI updates
      setTimeout(analyze, 50);
    }

    // --- Swing analysis: find the 3 key moments, compute tempo --------------
    function analyze() {
      if (frames.length < 15) {
        showResult({
          value: '—',
          verdict: 'Too short',
          verdictClass: 'error',
          detail: `Only ${frames.length} frames captured. Record for at least 2 seconds with your whole body in frame.`
        });
        return;
      }

      // Compute average wrist Y (vertical position) per frame.
      // In image coords, y=0 is top, y=1 is bottom.
      // At the top of the backswing, wrists are HIGHEST = smallest y.
      // At address and impact, wrists are near the bottom (large y).
      const wristY = frames.map(f => {
        const lw = f.landmarks[LM.LEFT_WRIST];
        const rw = f.landmarks[LM.RIGHT_WRIST];
        // Use whichever is more visible; average if both visible
        if (lw.v > 0.3 && rw.v > 0.3) return (lw.y + rw.y) / 2;
        if (lw.v > 0.3) return lw.y;
        if (rw.v > 0.3) return rw.y;
        return null;
      });

      // Fill small gaps by carrying forward the last known value
      let lastY = null;
      for (let i = 0; i < wristY.length; i++) {
        if (wristY[i] == null) wristY[i] = lastY;
        else lastY = wristY[i];
      }
      // If the first frames are null, use the first valid value
      let firstY = wristY.find(y => y != null);
      if (firstY == null) {
        showResult({
          value: '—',
          verdict: 'No pose detected',
          verdictClass: 'error',
          detail: 'The app could not detect your body. Make sure your whole body is in frame and well-lit.'
        });
        return;
      }
      for (let i = 0; i < wristY.length; i++) {
        if (wristY[i] == null) wristY[i] = firstY;
      }

      // Smooth the wrist-y trace with a small moving average (window=3)
      const smoothed = smooth(wristY, 3);

      // Find the TOP of the backswing: the frame where wristY is smallest (highest point).
      // We want the *global* minimum, but we also want to make sure it's actually
      // meaningfully high — reject cases where there was no real swing.
      let topIdx = 0;
      let topY = smoothed[0];
      for (let i = 1; i < smoothed.length; i++) {
        if (smoothed[i] < topY) {
          topY = smoothed[i];
          topIdx = i;
        }
      }

      // Find ADDRESS: the first frame before topIdx where the hands have been
      // stationary (the starting position). We look backward from topIdx for
      // the latest frame whose y is within a small band of the starting y.
      const startY = smoothed[0];
      let addressIdx = 0;
      // Threshold: hands need to have moved significantly up from start
      const moveThreshold = (startY - topY) * 0.15; // 15% of total upward travel
      for (let i = 1; i < topIdx; i++) {
        if (startY - smoothed[i] < moveThreshold) {
          addressIdx = i; // last frame still near starting position
        } else {
          break; // once we leave the address zone, we're into the backswing
        }
      }

      // Find IMPACT: the frame after topIdx where the wrists return to
      // approximately the starting y-level (hands back down in front of body).
      // Look for the first frame after topIdx where smoothed[i] >= startY - moveThreshold
      let impactIdx = smoothed.length - 1;
      for (let i = topIdx + 1; i < smoothed.length; i++) {
        if (smoothed[i] >= startY - moveThreshold) {
          impactIdx = i;
          break;
        }
      }

      // Sanity checks
      if (topIdx - addressIdx < 3) {
        showResult({
          value: '—',
          verdict: 'Backswing too short',
          verdictClass: 'error',
          detail: 'Could not detect a clear backswing. Try a fuller, slower motion, or re-check your framing.'
        });
        return;
      }
      if (impactIdx - topIdx < 2) {
        showResult({
          value: '—',
          verdict: 'Downswing too short',
          verdictClass: 'error',
          detail: 'Could not detect the downswing clearly. Make sure you stopped recording after the ball-strike moment.'
        });
        return;
      }

      // Compute times (in milliseconds)
      const tAddress = frames[addressIdx].t;
      const tTop = frames[topIdx].t;
      const tImpact = frames[impactIdx].t;
      const backswingMs = tTop - tAddress;
      const downswingMs = tImpact - tTop;
      const ratio = backswingMs / downswingMs;

      // Verdict — tour average is ~3:1, acceptable is roughly 2:1 to 4:1
      let verdict = 'In range';
      let verdictClass = 'good';
      if (ratio < 2.0) {
        verdict = 'Backswing too fast';
        verdictClass = 'off';
      } else if (ratio > 4.0) {
        verdict = 'Downswing too slow';
        verdictClass = 'off';
      } else if (ratio < 2.5 || ratio > 3.5) {
        verdict = 'A little off 3:1';
        verdictClass = 'off';
      }

      showResult({
        value: `${ratio.toFixed(1)}:1`,
        verdict,
        verdictClass,
        detail:
          `Backswing: ${Math.round(backswingMs)} ms\n` +
          `Downswing: ${Math.round(downswingMs)} ms\n` +
          `Frames analyzed: ${frames.length}\n` +
          `Address → Top → Impact: ${addressIdx} → ${topIdx} → ${impactIdx}`
      });
    }

    function smooth(arr, window) {
      const out = [];
      const half = Math.floor(window / 2);
      for (let i = 0; i < arr.length; i++) {
        let sum = 0, count = 0;
        for (let j = Math.max(0, i - half); j <= Math.min(arr.length - 1, i + half); j++) {
          sum += arr[j];
          count++;
        }
        out.push(sum / count);
      }
      return out;
    }

    function showResult({ value, verdict, verdictClass, detail }) {
      resultValue.textContent = value;
      resultVerdict.textContent = verdict;
      resultVerdict.className = '';
      if (verdictClass) resultVerdict.classList.add(verdictClass);
      resultDetail.textContent = detail;
      resultPanel.classList.add('visible');
      status.textContent = 'Tap Start, take your stance, swing, tap Stop.';
    }

    // --- Event wiring --------------------------------------------------------
    recordBtn.addEventListener('click', () => {
      if (isRecording) stopRecording();
      else startRecording();
    });

    resultClose.addEventListener('click', () => {
      resultPanel.classList.remove('visible');
    });

    // --- Boot ----------------------------------------------------------------
    (async function boot() {
      try {
        loadingLabel.textContent = 'Requesting camera…';
        await startCamera();
        loadingLabel.textContent = 'Loading pose detection…';
        await setupPose();
        pump(); // Start feeding frames to MediaPipe
        loading.classList.add('hidden');
        recordBtn.disabled = false;
        status.textContent = 'Ready. Tap Start.';
      } catch (e) {
        console.error(e);
        // If showError wasn't already called, show a generic one
        if (!errorPanel.classList.contains('visible')) {
          showError('Startup failed', e.message || 'Could not start the app.');
        }
      }
    })();
  </script>
</body>
</html>
