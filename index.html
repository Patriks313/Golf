<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Golf Coach — v0.1.3</title>
  <style>
    :root {
      --bg: #0f1712;
      --fg: #e8e4d8;
      --dim: #8a8778;
      --accent: #9bc53d;
      --warn: #e5a823;
      --error: #d95f43;
      --rec: #e74c3c;
      --address: #5dade2;
      --top: #af7ac5;
      --impact: #f39c12;
      --finish: #ec87c0;
      --beep: #e8e4d8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    #video-container {
      position: relative;
      flex: 1;
      background: #000;
      overflow: hidden;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #rec-indicator {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #rec-indicator.active { display: flex; }

    #rec-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--rec);
      animation: pulse 1s infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    #rec-border {
      position: absolute;
      inset: 0;
      border: 4px solid transparent;
      pointer-events: none;
      transition: border-color 0.2s;
    }

    #rec-border.active { border-color: var(--rec); }
    #rec-border.countdown { border-color: var(--accent); }

    #countdown {
      position: absolute;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      font-size: min(30vw, 240px);
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    #countdown.active { display: flex; }

    #countdown-label {
      position: absolute;
      bottom: 15%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 18px;
      font-weight: 400;
      color: var(--fg);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      letter-spacing: 1px;
      display: none;
    }

    #controls {
      padding: 16px 20px calc(env(safe-area-inset-bottom, 16px) + 16px);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #status {
      text-align: center;
      font-size: 14px;
      color: var(--dim);
      min-height: 20px;
      letter-spacing: 0.3px;
    }

    #record-btn {
      width: 100%;
      padding: 20px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: var(--bg);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    #record-btn:active { transform: scale(0.98); }
    #record-btn.recording { background: var(--rec); color: #fff; }
    #record-btn.counting { background: var(--warn); color: var(--bg); }
    #record-btn:disabled {
      background: var(--dim);
      color: rgba(0,0,0,0.4);
      cursor: not-allowed;
    }

    #result-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      padding: 24px 20px calc(env(safe-area-inset-bottom, 20px) + 20px);
      flex-direction: column;
      z-index: 10;
      overflow-y: auto;
    }

    #result-panel.visible { display: flex; }

    #result-header { text-align: center; margin-bottom: 16px; }

    #result-label {
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    #result-value {
      font-size: 56px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
    }

    #result-verdict {
      font-size: 16px;
      color: var(--fg);
    }

    #result-verdict.good { color: var(--accent); }
    #result-verdict.off { color: var(--warn); }
    #result-verdict.error { color: var(--error); }

    #warnings {
      margin: 12px 0;
      padding: 10px 14px;
      background: rgba(229, 168, 35, 0.12);
      border-left: 3px solid var(--warn);
      border-radius: 4px;
      font-size: 12px;
      color: var(--fg);
      display: none;
    }

    #warnings.visible { display: block; }

    #chart-section { margin: 16px 0; }

    #chart-title {
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    #chart-canvas {
      width: 100%;
      height: 180px;
      background: #1a2420;
      border-radius: 8px;
      display: block;
    }

    #chart-legend {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--dim);
      flex-wrap: wrap;
    }

    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    #diagnostics {
      background: #1a2420;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
    }

    .diag-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      color: var(--fg);
    }

    .diag-row + .diag-row { border-top: 1px solid rgba(232, 228, 216, 0.08); }
    .diag-label { color: var(--dim); }

    #result-actions {
      display: flex;
      gap: 12px;
      margin-top: auto;
    }

    #result-close, #result-save {
      flex: 1;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid var(--fg);
      border-radius: 10px;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    #result-close {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }

    #result-close:active, #result-save:active { opacity: 0.8; }

    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 20;
    }

    #loading.hidden { display: none; }

    #loading-label {
      font-size: 14px;
      color: var(--dim);
      letter-spacing: 1px;
    }

    #loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--dim);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #error-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      padding: 32px 24px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }

    #error-panel.visible { display: flex; }

    #error-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--error);
    }

    #error-message {
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
      color: var(--fg);
      max-width: 320px;
    }

    #debug {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      font-family: 'SF Mono', monospace;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="video-container">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="rec-border"></div>
      <div id="rec-indicator">
        <div id="rec-dot"></div>
        <span>REC</span>
      </div>
      <div id="countdown">6</div>
      <div id="countdown-label">Get into your stance</div>
      <div id="debug"></div>
    </div>

    <div id="controls">
      <div id="status">Tap Start. You have 6 seconds to get into stance.</div>
      <button id="record-btn" disabled>Start</button>
    </div>
  </div>

  <div id="loading">
    <div id="loading-spinner"></div>
    <div id="loading-label">Loading pose detection…</div>
  </div>

  <div id="result-panel">
    <div id="result-header">
      <div id="result-label">Tempo Ratio</div>
      <div id="result-value">—</div>
      <div id="result-verdict"></div>
    </div>

    <div id="warnings"></div>

    <div id="chart-section">
      <div id="chart-title">Wrist Height Over Time</div>
      <canvas id="chart-canvas"></canvas>
      <div id="chart-legend">
        <div class="legend-item"><div class="legend-dot" style="background: var(--beep)"></div>Beep</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--address)"></div>Address</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--top)"></div>Top</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--impact)"></div>Impact</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--finish)"></div>Finish</div>
      </div>
    </div>

    <div id="diagnostics"></div>

    <div id="result-actions">
      <button id="result-save">Save Raw Data</button>
      <button id="result-close">Next Swing</button>
    </div>
  </div>

  <div id="error-panel">
    <div id="error-title">Something went wrong</div>
    <div id="error-message"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>

  <script>
    // ============================================================
    // Golf Coach v0.1.3
    //  - Recognizes full-swing W-shape: peak (top) → valley (impact) → peak (finish)
    //  - Picks the most prominent peak-valley-peak cycle as the real swing
    //  - Warns when multiple candidate cycles are found (possible waggle)
    // ============================================================

    const COUNTDOWN_SECONDS = 6;

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const overlayCtx = overlay.getContext('2d');
    const recordBtn = document.getElementById('record-btn');
    const status = document.getElementById('status');
    const recIndicator = document.getElementById('rec-indicator');
    const recBorder = document.getElementById('rec-border');
    const countdownEl = document.getElementById('countdown');
    const countdownLabel = document.getElementById('countdown-label');
    const loading = document.getElementById('loading');
    const loadingLabel = document.getElementById('loading-label');
    const resultPanel = document.getElementById('result-panel');
    const resultValue = document.getElementById('result-value');
    const resultVerdict = document.getElementById('result-verdict');
    const warningsEl = document.getElementById('warnings');
    const diagnostics = document.getElementById('diagnostics');
    const chartCanvas = document.getElementById('chart-canvas');
    const chartCtx = chartCanvas.getContext('2d');
    const resultClose = document.getElementById('result-close');
    const resultSave = document.getElementById('result-save');
    const errorPanel = document.getElementById('error-panel');
    const errorMessage = document.getElementById('error-message');
    const debug = document.getElementById('debug');

    let pose = null;
    let appState = 'idle';
    let frames = [];
    let recordingStartTime = 0;
    let beepTime = 0;
    let countdownTimer = null;
    let rafId = null;
    let lastAnalysis = null;
    let audioCtx = null;

    function showError(title, message) {
      errorPanel.querySelector('#error-title').textContent = title;
      errorMessage.textContent = message;
      errorPanel.classList.add('visible');
      loading.classList.add('hidden');
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
          audio: false
        });
        video.srcObject = stream;
        await new Promise((resolve) => {
          video.onloadedmetadata = () => { video.play(); resolve(); };
        });
        resizeOverlay();
        window.addEventListener('resize', resizeOverlay);
      } catch (e) {
        showError('Camera access denied', 'This app needs camera access. Please allow it and reload.');
        throw e;
      }
    }

    function resizeOverlay() {
      overlay.width = video.clientWidth;
      overlay.height = video.clientHeight;
    }

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.3, now + 0.02);
      gain.gain.linearRampToValueAtTime(0, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    }

    function playTick() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.12, now + 0.01);
      gain.gain.linearRampToValueAtTime(0, now + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    }

    async function setupPose() {
      pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${file}`
      });
      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      pose.onResults(onPoseResults);
      await pose.initialize?.();
    }

    function onPoseResults(results) {
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      if (results.poseLandmarks) {
        drawSkeleton(results.poseLandmarks);
        if (appState === 'recording') {
          frames.push({
            t: performance.now() - recordingStartTime,
            landmarks: results.poseLandmarks.map(lm => ({
              x: lm.x, y: lm.y, z: lm.z, v: lm.visibility
            }))
          });
          debug.textContent = `frames: ${frames.length}`;
        }
      }
    }

    const LM = {
      NOSE: 0,
      LEFT_SHOULDER: 11, RIGHT_SHOULDER: 12,
      LEFT_ELBOW: 13, RIGHT_ELBOW: 14,
      LEFT_WRIST: 15, RIGHT_WRIST: 16,
      LEFT_HIP: 23, RIGHT_HIP: 24,
      LEFT_KNEE: 25, RIGHT_KNEE: 26,
      LEFT_ANKLE: 27, RIGHT_ANKLE: 28
    };

    const BONES = [
      [LM.LEFT_SHOULDER, LM.RIGHT_SHOULDER],
      [LM.LEFT_SHOULDER, LM.LEFT_ELBOW], [LM.LEFT_ELBOW, LM.LEFT_WRIST],
      [LM.RIGHT_SHOULDER, LM.RIGHT_ELBOW], [LM.RIGHT_ELBOW, LM.RIGHT_WRIST],
      [LM.LEFT_SHOULDER, LM.LEFT_HIP], [LM.RIGHT_SHOULDER, LM.RIGHT_HIP],
      [LM.LEFT_HIP, LM.RIGHT_HIP],
      [LM.LEFT_HIP, LM.LEFT_KNEE], [LM.LEFT_KNEE, LM.LEFT_ANKLE],
      [LM.RIGHT_HIP, LM.RIGHT_KNEE], [LM.RIGHT_KNEE, LM.RIGHT_ANKLE]
    ];

    function drawSkeleton(landmarks) {
      const w = overlay.width, h = overlay.height;
      const toX = (x) => (1 - x) * w;
      const toY = (y) => y * h;
      overlayCtx.lineWidth = 3;
      overlayCtx.strokeStyle = 'rgba(155, 197, 61, 0.85)';
      overlayCtx.fillStyle = 'rgba(232, 228, 216, 0.95)';
      for (const [a, b] of BONES) {
        const la = landmarks[a], lb = landmarks[b];
        if (la.visibility > 0.3 && lb.visibility > 0.3) {
          overlayCtx.beginPath();
          overlayCtx.moveTo(toX(la.x), toY(la.y));
          overlayCtx.lineTo(toX(lb.x), toY(lb.y));
          overlayCtx.stroke();
        }
      }
      const keyJoints = [LM.LEFT_SHOULDER, LM.RIGHT_SHOULDER, LM.LEFT_ELBOW, LM.RIGHT_ELBOW,
        LM.LEFT_WRIST, LM.RIGHT_WRIST, LM.LEFT_HIP, LM.RIGHT_HIP, LM.LEFT_KNEE, LM.RIGHT_KNEE];
      for (const idx of keyJoints) {
        const lm = landmarks[idx];
        if (lm.visibility > 0.3) {
          overlayCtx.beginPath();
          overlayCtx.arc(toX(lm.x), toY(lm.y), 4, 0, 2 * Math.PI);
          overlayCtx.fill();
        }
      }
    }

    async function pump() {
      if (video.readyState >= 2) await pose.send({ image: video });
      rafId = requestAnimationFrame(pump);
    }

    // --- Countdown / recording lifecycle ------------------------------------
    function startCountdown() {
      ensureAudio();
      appState = 'counting';
      let remaining = COUNTDOWN_SECONDS;
      recordBtn.textContent = `${remaining}…`;
      recordBtn.classList.add('counting');
      recordBtn.disabled = true;
      countdownEl.textContent = remaining;
      countdownEl.classList.add('active');
      countdownLabel.style.display = 'block';
      recBorder.classList.add('countdown');
      status.textContent = 'Get into your stance. Swing when the beep plays.';
      playTick();
      countdownTimer = setInterval(() => {
        remaining--;
        if (remaining > 0) {
          recordBtn.textContent = `${remaining}…`;
          countdownEl.textContent = remaining;
          playTick();
        } else {
          clearInterval(countdownTimer);
          countdownTimer = null;
          countdownEl.classList.remove('active');
          countdownLabel.style.display = 'none';
          recBorder.classList.remove('countdown');
          beginRecording();
        }
      }, 1000);
    }

    function beginRecording() {
      playBeep();
      frames = [];
      recordingStartTime = performance.now();
      beepTime = 0;
      appState = 'recording';
      recordBtn.textContent = 'Stop';
      recordBtn.classList.remove('counting');
      recordBtn.classList.add('recording');
      recordBtn.disabled = false;
      recIndicator.classList.add('active');
      recBorder.classList.add('active');
      status.textContent = 'Recording… swing, then tap Stop.';
    }

    function stopRecording() {
      appState = 'idle';
      recordBtn.textContent = 'Start';
      recordBtn.classList.remove('recording');
      recIndicator.classList.remove('active');
      recBorder.classList.remove('active');
      status.textContent = 'Analyzing…';
      debug.textContent = '';
      setTimeout(analyze, 50);
    }

    // --- Peak/valley finder --------------------------------------------------
    // For wristY: LOW value = HIGH hands.
    // "Swing peaks" (hands high moments) = local MINIMA of wristY.
    // "Swing valleys" (hands low moments) = local MAXIMA of wristY.
    //
    // Prominence: how much the peak/valley stands out against the surrounding
    // terrain. Low-prominence peaks are noise; high-prominence peaks are real
    // swing events.

    function findPeaks(y, minProminence) {
      // Returns indices where y[i] is a local MINIMUM (hands high) with
      // at least minProminence of depth.
      const peaks = [];
      const n = y.length;
      for (let i = 1; i < n - 1; i++) {
        if (y[i] < y[i-1] && y[i] < y[i+1]) {
          peaks.push(i);
        }
      }
      // Compute prominence for each, filter
      const prominent = [];
      for (const p of peaks) {
        // Look left: find the highest y (= lowest hands) before reaching a lower y (higher hands).
        // Prominence = how much we have to "climb down" (in y terms, climb up)
        // on each side before finding another point at least as high (y low) as p.
        let leftMax = y[p];
        for (let i = p - 1; i >= 0; i--) {
          if (y[i] < y[p]) break; // found a higher peak on the left
          if (y[i] > leftMax) leftMax = y[i];
        }
        let rightMax = y[p];
        for (let i = p + 1; i < n; i++) {
          if (y[i] < y[p]) break;
          if (y[i] > rightMax) rightMax = y[i];
        }
        const prom = Math.min(leftMax, rightMax) - y[p];
        if (prom >= minProminence) prominent.push({ idx: p, prominence: prom, value: y[p] });
      }
      return prominent;
    }

    function findValleys(y, minProminence) {
      // Local MAXIMA of wristY = hands LOW.
      const valleys = [];
      const n = y.length;
      for (let i = 1; i < n - 1; i++) {
        if (y[i] > y[i-1] && y[i] > y[i+1]) {
          valleys.push(i);
        }
      }
      const prominent = [];
      for (const v of valleys) {
        let leftMin = y[v];
        for (let i = v - 1; i >= 0; i--) {
          if (y[i] > y[v]) break;
          if (y[i] < leftMin) leftMin = y[i];
        }
        let rightMin = y[v];
        for (let i = v + 1; i < n; i++) {
          if (y[i] > y[v]) break;
          if (y[i] < rightMin) rightMin = y[i];
        }
        const prom = y[v] - Math.max(leftMin, rightMin);
        if (prom >= minProminence) prominent.push({ idx: v, prominence: prom, value: y[v] });
      }
      return prominent;
    }

    // --- Main analysis -------------------------------------------------------
    function analyze() {
      if (frames.length < 15) {
        showResult({
          value: '—', verdict: 'Too short', verdictClass: 'error',
          wristY: [],
          addressIdx: null, topIdx: null, impactIdx: null, finishIdx: null,
          diag: [['Frames captured', frames.length]],
          warnings: []
        });
        return;
      }

      // Build wrist Y trace
      const rawY = frames.map(f => {
        const lw = f.landmarks[LM.LEFT_WRIST];
        const rw = f.landmarks[LM.RIGHT_WRIST];
        if (lw.v > 0.3 && rw.v > 0.3) return (lw.y + rw.y) / 2;
        if (lw.v > 0.3) return lw.y;
        if (rw.v > 0.3) return rw.y;
        return null;
      });
      let lastY = null;
      for (let i = 0; i < rawY.length; i++) {
        if (rawY[i] == null) rawY[i] = lastY;
        else lastY = rawY[i];
      }
      let firstY = rawY.find(y => y != null);
      if (firstY == null) {
        showResult({
          value: '—', verdict: 'No pose detected', verdictClass: 'error',
          wristY: [], addressIdx: null, topIdx: null, impactIdx: null, finishIdx: null,
          diag: [['Frames captured', frames.length], ['Pose detected in', '0 frames']],
          warnings: []
        });
        return;
      }
      for (let i = 0; i < rawY.length; i++) {
        if (rawY[i] == null) rawY[i] = firstY;
      }

      const smoothed = smooth(rawY, 5);

      // Overall range tells us what "prominent" should mean
      const minY = Math.min(...smoothed);
      const maxY = Math.max(...smoothed);
      const totalRange = maxY - minY;

      // Prominence threshold: 10% of total range, with absolute floor
      const minProminence = Math.max(0.04, totalRange * 0.15);

      const peaks = findPeaks(smoothed, minProminence);    // hands-high moments
      const valleys = findValleys(smoothed, minProminence); // hands-low moments

      const warnings = [];

      // --- Find the SWING: a peak → valley → peak sequence ---
      // Strategy: among all (peak1, valley, peak2) triples where valley sits
      // between peak1 and peak2, pick the one with highest total prominence.
      // Then top = peak1, impact = valley, finish = peak2.

      let bestTriple = null;
      let bestScore = -1;

      for (let i = 0; i < peaks.length; i++) {
        for (let j = i + 1; j < peaks.length; j++) {
          const p1 = peaks[i], p2 = peaks[j];
          // Find the highest-wristY valley between them (hands lowest = impact)
          let bestValley = null;
          for (const v of valleys) {
            if (v.idx > p1.idx && v.idx < p2.idx) {
              if (!bestValley || v.value > bestValley.value) bestValley = v;
            }
          }
          if (!bestValley) continue;
          // Score = combined prominence
          const score = p1.prominence + p2.prominence + bestValley.prominence;
          if (score > bestScore) {
            bestScore = score;
            bestTriple = { top: p1, impact: bestValley, finish: p2 };
          }
        }
      }

      let topIdx, impactIdx, finishIdx, addressIdx;

      if (bestTriple) {
        topIdx = bestTriple.top.idx;
        impactIdx = bestTriple.impact.idx;
        finishIdx = bestTriple.finish.idx;
        if (peaks.length > 2) {
          warnings.push(`Detected ${peaks.length} high-hand peaks; used the most prominent two. If you didn't make a full practice motion, try one continuous swing from a settled stance.`);
        }
      } else if (peaks.length === 1) {
        // Only one peak found — this is a partial swing (no follow-through)
        // Fall back to the older approach: top is the peak, impact is the
        // lowest point after the peak.
        topIdx = peaks[0].idx;
        finishIdx = null;
        let candidate = null;
        for (let i = topIdx + 1; i < smoothed.length; i++) {
          if (!candidate || smoothed[i] > smoothed[candidate]) candidate = i;
        }
        impactIdx = candidate != null ? candidate : smoothed.length - 1;
        warnings.push('Only one peak detected — this looks like a partial swing with no follow-through. For full swings, swing all the way through to the finish position.');
      } else {
        // No prominent peaks at all
        showResult({
          value: '—', verdict: 'No swing detected', verdictClass: 'error',
          wristY: smoothed,
          addressIdx: 0, topIdx: null, impactIdx: null, finishIdx: null,
          diag: [
            ['Frames captured', frames.length],
            ['wristY range', totalRange.toFixed(3)],
            ['Prominent peaks found', 0]
          ],
          warnings: ['No clear swing motion detected. Make sure your whole body (including arms raised at the top of your swing) stays in frame.']
        });
        return;
      }

      // --- Find ADDRESS: motion onset before Top ---
      // Look for the last period of stillness before topIdx.
      const STILLNESS_WINDOW = 6;
      const topY = smoothed[topIdx];
      const stillnessThreshold = Math.max(0.015, (smoothed[0] - topY) * 0.05);
      addressIdx = 0;
      for (let i = topIdx - 1; i >= STILLNESS_WINDOW; i--) {
        let mx = -Infinity, mn = Infinity;
        for (let j = i - STILLNESS_WINDOW; j <= i; j++) {
          if (smoothed[j] > mx) mx = smoothed[j];
          if (smoothed[j] < mn) mn = smoothed[j];
        }
        if (mx - mn < stillnessThreshold) { addressIdx = i; break; }
      }
      // Fallback if no clear stillness window
      if (addressIdx === 0 && topIdx > 8) {
        const band = (smoothed[0] - topY) * 0.10;
        for (let i = 1; i < topIdx; i++) {
          if (Math.abs(smoothed[i] - smoothed[0]) < band) addressIdx = i;
          else break;
        }
      }

      // --- Compute timings ---
      const tAddress = frames[addressIdx].t;
      const tTop = frames[topIdx].t;
      const tImpact = frames[impactIdx].t;
      const tFinish = finishIdx != null ? frames[finishIdx].t : null;
      const backswingMs = tTop - tAddress;
      const downswingMs = tImpact - tTop;
      const totalMs = frames[frames.length - 1].t;
      const fps = frames.length / (totalMs / 1000);
      const beepToAddressMs = tAddress - beepTime;

      const diag = [
        ['Frames captured', frames.length],
        ['Duration', `${(totalMs/1000).toFixed(2)} s`],
        ['Effective FPS', fps.toFixed(1)],
        ['Beep → motion onset', `${beepToAddressMs.toFixed(0)} ms`],
        ['Address frame', `${addressIdx}  (${tAddress.toFixed(0)} ms)`],
        ['Top frame', `${topIdx}  (${tTop.toFixed(0)} ms)`],
        ['Impact frame', `${impactIdx}  (${tImpact.toFixed(0)} ms)`],
      ];
      if (finishIdx != null) diag.push(['Finish frame', `${finishIdx}  (${tFinish.toFixed(0)} ms)`]);
      diag.push(['Backswing', `${backswingMs.toFixed(0)} ms`]);
      diag.push(['Downswing', `${downswingMs.toFixed(0)} ms`]);
      diag.push(['Peaks found', peaks.length]);
      diag.push(['Valleys found', valleys.length]);
      diag.push(['Wrist rise', (smoothed[addressIdx] - topY).toFixed(3)]);

      // --- Verdict ---
      let ratioValue = '—';
      let verdict = '';
      let verdictClass = '';

      if (backswingMs <= 0 || downswingMs <= 0) {
        verdict = 'Detection failed';
        verdictClass = 'error';
      } else if (smoothed[addressIdx] - topY < 0.08) {
        verdict = 'No swing detected';
        verdictClass = 'error';
      } else {
        const ratio = backswingMs / downswingMs;
        ratioValue = `${ratio.toFixed(1)}:1`;
        if (ratio < 2.0) { verdict = 'Backswing too fast'; verdictClass = 'off'; }
        else if (ratio > 4.0) { verdict = 'Downswing too slow'; verdictClass = 'off'; }
        else if (ratio < 2.5 || ratio > 3.5) { verdict = 'A little off 3:1'; verdictClass = 'off'; }
        else { verdict = 'In range'; verdictClass = 'good'; }
      }

      showResult({
        value: ratioValue, verdict, verdictClass,
        wristY: smoothed,
        addressIdx, topIdx, impactIdx, finishIdx,
        diag, warnings
      });
    }

    function smooth(arr, window) {
      const out = [];
      const half = Math.floor(window / 2);
      for (let i = 0; i < arr.length; i++) {
        let s = 0, c = 0;
        for (let j = Math.max(0, i - half); j <= Math.min(arr.length - 1, i + half); j++) {
          s += arr[j]; c++;
        }
        out.push(s / c);
      }
      return out;
    }

    // --- Chart ---------------------------------------------------------------
    function drawChart(wristY, addressIdx, topIdx, impactIdx, finishIdx) {
      const dpr = window.devicePixelRatio || 1;
      const rect = chartCanvas.getBoundingClientRect();
      chartCanvas.width = rect.width * dpr;
      chartCanvas.height = rect.height * dpr;
      chartCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      chartCtx.clearRect(0, 0, rect.width, rect.height);

      const w = rect.width, h = rect.height;
      const padX = 8, padY = 16;
      const plotW = w - 2 * padX, plotH = h - 2 * padY;

      if (wristY.length < 2) {
        chartCtx.fillStyle = 'rgba(232, 228, 216, 0.4)';
        chartCtx.font = '12px -apple-system, sans-serif';
        chartCtx.textAlign = 'center';
        chartCtx.fillText('Not enough data', w / 2, h / 2);
        return;
      }

      const minY = Math.min(...wristY);
      const maxY = Math.max(...wristY);
      const range = Math.max(0.05, maxY - minY);
      const toPx = (idx) => padX + (idx / (wristY.length - 1)) * plotW;
      const toPy = (y) => padY + ((y - minY) / range) * plotH;

      if (addressIdx != null && addressIdx >= 0 && addressIdx < wristY.length) {
        chartCtx.strokeStyle = 'rgba(232, 228, 216, 0.08)';
        chartCtx.lineWidth = 1;
        chartCtx.beginPath();
        chartCtx.moveTo(padX, toPy(wristY[addressIdx]));
        chartCtx.lineTo(padX + plotW, toPy(wristY[addressIdx]));
        chartCtx.stroke();
      }

      chartCtx.strokeStyle = 'rgba(155, 197, 61, 0.9)';
      chartCtx.lineWidth = 2;
      chartCtx.beginPath();
      for (let i = 0; i < wristY.length; i++) {
        const px = toPx(i), py = toPy(wristY[i]);
        if (i === 0) chartCtx.moveTo(px, py);
        else chartCtx.lineTo(px, py);
      }
      chartCtx.stroke();

      // Beep marker
      {
        const px = toPx(0);
        chartCtx.strokeStyle = 'rgba(232, 228, 216, 0.35)';
        chartCtx.lineWidth = 1;
        chartCtx.setLineDash([2, 4]);
        chartCtx.beginPath();
        chartCtx.moveTo(px, padY);
        chartCtx.lineTo(px, padY + plotH);
        chartCtx.stroke();
        chartCtx.setLineDash([]);
        chartCtx.fillStyle = 'rgba(232, 228, 216, 0.7)';
        chartCtx.font = 'bold 10px -apple-system, sans-serif';
        chartCtx.textAlign = 'left';
        chartCtx.fillText('Beep', px + 3, padY + 10);
      }

      const events = [
        { idx: addressIdx, color: '#5dade2', label: 'A' },
        { idx: topIdx, color: '#af7ac5', label: 'T' },
        { idx: impactIdx, color: '#f39c12', label: 'I' },
        { idx: finishIdx, color: '#ec87c0', label: 'F' }
      ];

      for (const ev of events) {
        if (ev.idx == null || ev.idx < 0 || ev.idx >= wristY.length) continue;
        const px = toPx(ev.idx);
        const py = toPy(wristY[ev.idx]);
        chartCtx.strokeStyle = ev.color + '66';
        chartCtx.lineWidth = 1;
        chartCtx.setLineDash([3, 3]);
        chartCtx.beginPath();
        chartCtx.moveTo(px, padY);
        chartCtx.lineTo(px, padY + plotH);
        chartCtx.stroke();
        chartCtx.setLineDash([]);
        chartCtx.fillStyle = ev.color;
        chartCtx.beginPath();
        chartCtx.arc(px, py, 5, 0, 2 * Math.PI);
        chartCtx.fill();
        chartCtx.fillStyle = ev.color;
        chartCtx.font = 'bold 10px -apple-system, sans-serif';
        chartCtx.textAlign = 'center';
        chartCtx.fillText(ev.label, px, padY - 4);
      }
    }

    function showResult({ value, verdict, verdictClass, wristY, addressIdx, topIdx, impactIdx, finishIdx, diag, warnings }) {
      resultValue.textContent = value;
      resultVerdict.textContent = verdict;
      resultVerdict.className = '';
      if (verdictClass) resultVerdict.classList.add(verdictClass);

      if (warnings && warnings.length > 0) {
        warningsEl.innerHTML = warnings.map(w => `<div>⚠ ${w}</div>`).join('');
        warningsEl.classList.add('visible');
      } else {
        warningsEl.classList.remove('visible');
      }

      diagnostics.innerHTML = '';
      for (const [label, val] of diag) {
        const row = document.createElement('div');
        row.className = 'diag-row';
        row.innerHTML = `<span class="diag-label">${label}</span><span>${val}</span>`;
        diagnostics.appendChild(row);
      }
      resultPanel.classList.add('visible');
      status.textContent = 'Tap Start for next swing.';
      requestAnimationFrame(() => {
        drawChart(wristY, addressIdx, topIdx, impactIdx, finishIdx);
      });

      lastAnalysis = {
        version: '0.1.3',
        timestamp: new Date().toISOString(),
        value, verdict,
        addressIdx, topIdx, impactIdx, finishIdx,
        wristY,
        frames: frames.map(f => ({
          t: f.t,
          leftWrist: f.landmarks[LM.LEFT_WRIST],
          rightWrist: f.landmarks[LM.RIGHT_WRIST],
          leftHip: f.landmarks[LM.LEFT_HIP],
          rightHip: f.landmarks[LM.RIGHT_HIP],
          leftShoulder: f.landmarks[LM.LEFT_SHOULDER],
          rightShoulder: f.landmarks[LM.RIGHT_SHOULDER],
          nose: f.landmarks[LM.NOSE]
        }))
      };
    }

    function saveRawData() {
      if (!lastAnalysis) return;
      const json = JSON.stringify(lastAnalysis, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      a.href = url;
      a.download = `swing-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    recordBtn.addEventListener('click', () => {
      if (appState === 'idle') startCountdown();
      else if (appState === 'recording') stopRecording();
    });
    resultClose.addEventListener('click', () => resultPanel.classList.remove('visible'));
    resultSave.addEventListener('click', saveRawData);

    (async function boot() {
      try {
        loadingLabel.textContent = 'Requesting camera…';
        await startCamera();
        loadingLabel.textContent = 'Loading pose detection…';
        await setupPose();
        pump();
        loading.classList.add('hidden');
        recordBtn.disabled = false;
        status.textContent = 'Tap Start. You have 6 seconds to get into stance.';
      } catch (e) {
        console.error(e);
        if (!errorPanel.classList.contains('visible')) {
          showError('Startup failed', e.message || 'Could not start the app.');
        }
      }
    })();
  </script>
</body>
