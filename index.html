<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Golf Coach — Tempo (v0.2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0f1412;
    --panel:    #161d1a;
    --ink:      #e8efe9;
    --ink-dim:  #8fa196;
    --accent:   #9dd69a;  /* muted fairway */
    --warn:     #e2b24a;  /* soft amber */
    --bad:      #d87a7a;  /* soft red */
    --line:     #26322d;
    --listening:#6fb4ff;  /* distinct from pass/fail to avoid misreading */
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Fraunces", Georgia, serif;
    font-size: 17px;
    line-height: 1.45;
    min-height: 100dvh;
    padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header .ver {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--ink-dim);
  }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .stage video, .stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .stage video { transform: scaleX(-1); } /* mirror front camera */
  .stage canvas { pointer-events: none; }

  /* overlay indicators */
  .badge {
    position: absolute;
    top: 10px;
    left: 10px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink-dim);
  }
  .dot.idle      { background: var(--ink-dim); }
  .dot.listening { background: var(--listening); animation: pulse 1.2s ease-in-out infinite; }
  .dot.countdown { background: var(--warn); }
  .dot.recording { background: var(--bad); }
  .dot.analyzing { background: var(--warn); }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .35; transform: scale(.85); }
  }

  .countdown-big {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: "JetBrains Mono", monospace;
    font-size: clamp(80px, 22vw, 160px);
    color: rgba(232,239,233,0.92);
    text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  .countdown-big.on { display: flex; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-top: 12px;
  }
  .panel h2 {
    margin: 0 0 8px 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  button {
    font-family: inherit;
    font-size: 15px;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button.primary {
    background: var(--accent);
    color: #0f1412;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.danger {
    background: var(--bad);
    color: #1b0f0f;
    border-color: var(--bad);
    font-weight: 600;
  }
  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .row + .row { margin-top: 8px; }

  .stat {
    display: inline-flex;
    flex-direction: column;
    padding: 8px 12px;
    background: #0f1412;
    border: 1px solid var(--line);
    border-radius: 10px;
    min-width: 90px;
  }
  .stat .label {
    font-size: 11px;
    color: var(--ink-dim);
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .stat .value {
    font-family: "JetBrains Mono", monospace;
    font-size: 18px;
    font-weight: 600;
    margin-top: 2px;
  }
  .stat.pass .value { color: var(--accent); }
  .stat.fail .value { color: var(--bad); }

  .log {
    max-height: 140px;
    overflow-y: auto;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    line-height: 1.55;
    color: var(--ink-dim);
    background: #0b0f0d;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    white-space: pre-wrap;
  }

  #chart {
    width: 100%;
    height: 140px;
    background: #0b0f0d;
    border: 1px solid var(--line);
    border-radius: 10px;
    display: block;
  }

  .hint {
    font-size: 13px;
    color: var(--ink-dim);
    margin: 6px 0 0 0;
  }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-dim);
    cursor: pointer;
  }
  .toggle input { accent-color: var(--accent); }

  footer {
    margin-top: 20px;
    font-size: 12px;
    color: var(--ink-dim);
    text-align: center;
    font-family: "JetBrains Mono", monospace;
  }
</style>
</head>
<body>

<header>
  <h1>Golf Coach — Tempo</h1>
  <span class="ver mono">v0.2.0</span>
</header>

<div class="stage" id="stage">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
  <div class="badge">
    <span class="dot idle" id="statusDot"></span>
    <span id="statusText">idle</span>
  </div>
  <div class="countdown-big" id="countdownBig">3</div>
</div>

<div class="panel">
  <h2>Session</h2>
  <div class="row">
    <button id="btnSession" class="primary">Start session</button>
    <button id="btnStop" class="danger" disabled>End swing</button>
    <button id="btnManualReady" disabled>Tap &ldquo;ready&rdquo;</button>
  </div>
  <div class="row">
    <label class="toggle">
      <input type="checkbox" id="toggleVoice" checked />
      Listen for &ldquo;ready&rdquo;
    </label>
    <span class="hint" id="voiceHint">&nbsp;</span>
  </div>
  <p class="hint">
    Stand 2&ndash;2.5&nbsp;m from the phone, face-on. Say <strong>ready</strong> &rarr; wait for the beep &rarr; swing through to a full finish &rarr; tap <em>End swing</em>.
  </p>
</div>

<div class="panel">
  <h2>Last swing</h2>
  <div class="row">
    <div class="stat" id="statBack"><span class="label">backswing</span><span class="value mono">&mdash;</span></div>
    <div class="stat" id="statDown"><span class="label">downswing</span><span class="value mono">&mdash;</span></div>
    <div class="stat" id="statRatio"><span class="label">ratio</span><span class="value mono">&mdash;</span></div>
    <div class="stat" id="statFps"><span class="label">fps</span><span class="value mono">&mdash;</span></div>
  </div>
  <div class="row" style="margin-top: 12px;">
    <canvas id="chart"></canvas>
  </div>
</div>

<div class="panel">
  <h2>Log</h2>
  <div class="log" id="log"></div>
</div>

<footer>MediaPipe Pose · runs on-device · no video stored</footer>

<!-- MediaPipe Pose via CDN (jsdelivr) -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

<script>
/* =======================================================================
   Golf Coach — v0.2.0
   Voice trigger replaces tap-to-start.
   Everything else preserved from v0.1.6:
     - Face-on, front camera
     - MediaPipe Pose, 33 keypoints
     - W-shape wrist-height tempo algorithm
       (Address onset, prominence peaks, 300 ms merge, valley = impact)
     - Partial swings rejected
   ======================================================================= */

/* ---------- tunables (copied from v0.1.6) ---------- */
const WRIST_CONF_GOOD    = 0.7;   // use avg of both wrists above this
const WRIST_CONF_MIN     = 0.5;   // below this, drop the frame
const MAX_SWING_MS       = 4000;  // analysis window length from Address
const PEAK_PROMINENCE    = 0.15;  // 15% of window range
const PEAK_MERGE_MS      = 300;   // merge peaks within this gap
const MOTION_ONSET_UP    = 0.008; // normalized Y units per frame, smoothed
const MOTION_ONSET_FRAMES = 3;    // sustained frames required

/* ---------- v0.2 voice trigger tunables ---------- */
const COUNTDOWN_MS        = [600, 600, 600]; // tick, tick, beep
const MAX_RECORD_MS       = 6000;            // auto-stop safety net
const MIC_RESTART_DELAY   = 400;             // debounce auto-restart

/* ---------- dom ---------- */
const $ = (id) => document.getElementById(id);
const video = $("video");
const overlay = $("overlay");
const octx = overlay.getContext("2d");
const chart = $("chart");
const cctx = chart.getContext("2d");
const statusDot = $("statusDot");
const statusText = $("statusText");
const countdownBig = $("countdownBig");
const btnSession = $("btnSession");
const btnStop = $("btnStop");
const btnManualReady = $("btnManualReady");
const toggleVoice = $("toggleVoice");
const voiceHint = $("voiceHint");
const logEl = $("log");

/* ---------- app state ---------- */
const state = {
  sessionActive: false,
  phase: "idle",    // idle | listening | countdown | recording | analyzing
  frames: [],       // per-frame {t, wristY, wristConf, pose}
  recordStartT: 0,
  pose: null,       // MediaPipe Pose instance
  audioCtx: null,
  recognition: null,
  recognitionRunning: false,
  micRestartPending: false,
  cameraReady: false,
};

/* ---------- logging ---------- */
function log(msg, level="info") {
  const t = new Date().toISOString().slice(11, 23);
  const line = `[${t}] ${msg}`;
  logEl.textContent = (line + "\n" + logEl.textContent).slice(0, 8000);
  if (level === "error") console.error(line);
  else console.log(line);
}

/* ---------- status chip ---------- */
function setStatus(phase, text) {
  state.phase = phase;
  statusDot.className = "dot " + phase;
  statusText.textContent = text ?? phase;
}

/* ===================================================================
   Camera + Pose
   =================================================================== */

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width:  { ideal: 720 },
        height: { ideal: 960 },
        frameRate: { ideal: 30 }
      },
      audio: false
    });
    video.srcObject = stream;
    await new Promise(r => {
      if (video.readyState >= 2) return r();
      video.onloadedmetadata = () => r();
    });
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
    state.cameraReady = true;
    log(`camera ready ${video.videoWidth}x${video.videoHeight}`);
  } catch (err) {
    log("camera failed: " + err.message, "error");
    alert("Camera permission is required. Check your browser settings.");
  }
}

async function startPose() {
  // eslint-disable-next-line no-undef
  const pose = new Pose({
    locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`
  });
  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  pose.onResults(onPoseResults);
  await pose.initialize();
  state.pose = pose;
  log("pose model initialized");
  requestAnimationFrame(poseLoop);
}

async function poseLoop() {
  if (state.pose && state.cameraReady && video.readyState >= 2) {
    try {
      await state.pose.send({ image: video });
    } catch (e) { /* swallow occasional send errors */ }
  }
  requestAnimationFrame(poseLoop);
}

function onPoseResults(res) {
  drawOverlay(res);
  if (state.phase !== "recording") return;

  const lms = res.poseLandmarks;
  if (!lms) return;

  // MediaPipe Pose landmark indices: 15 = left wrist, 16 = right wrist
  const lw = lms[15], rw = lms[16];
  // Normalized coords: y grows downward. Invert so "up" = higher number for chart clarity.
  // But tempo algorithm per brief operates on wristY as given (higher y = lower hands).
  // We'll keep MediaPipe's convention: wristY large = low hands (address), small = high hands (top).

  let wristY = null;
  let conf = null;
  if (lw.visibility >= WRIST_CONF_GOOD && rw.visibility >= WRIST_CONF_GOOD) {
    wristY = (lw.y + rw.y) / 2;
    conf = Math.min(lw.visibility, rw.visibility);
  } else {
    // fall back to the more-visible wrist
    const best = (lw.visibility >= rw.visibility) ? lw : rw;
    if (best.visibility >= WRIST_CONF_MIN) {
      wristY = best.y;
      conf = best.visibility;
    }
  }

  if (wristY === null) return; // drop low-confidence frame

  const now = performance.now();
  state.frames.push({ t: now - state.recordStartT, wristY, conf });

  // safety auto-stop
  if (now - state.recordStartT > MAX_RECORD_MS) {
    log("max record time hit, auto-stopping");
    endSwing();
  }
}

function drawOverlay(res) {
  const w = overlay.width, h = overlay.height;
  octx.clearRect(0, 0, w, h);
  if (!res.poseLandmarks) return;

  // mirrored — we flipped video via CSS. Draw mirrored too so markers line up.
  octx.save();
  octx.translate(w, 0);
  octx.scale(-1, 1);

  // draw wrists only (minimal overlay to keep it useful not noisy)
  const lw = res.poseLandmarks[15];
  const rw = res.poseLandmarks[16];
  [lw, rw].forEach(p => {
    if (!p || p.visibility < WRIST_CONF_MIN) return;
    octx.beginPath();
    octx.arc(p.x * w, p.y * h, 8, 0, Math.PI * 2);
    octx.fillStyle = p.visibility >= WRIST_CONF_GOOD ? "rgba(157,214,154,0.9)" : "rgba(226,178,74,0.85)";
    octx.fill();
  });
  octx.restore();
}

/* ===================================================================
   Audio — countdown ticks, beep, feedback chimes (minimal; v0.3 expands)
   =================================================================== */

function audio() {
  if (!state.audioCtx) {
    state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return state.audioCtx;
}

function tone(freq, durMs, { type="sine", gain=0.15 } = {}) {
  const ctx = audio();
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.value = 0;
  g.gain.linearRampToValueAtTime(gain, ctx.currentTime + 0.01);
  g.gain.linearRampToValueAtTime(0, ctx.currentTime + durMs / 1000);
  osc.connect(g).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + durMs / 1000 + 0.02);
}

const tick   = () => tone(660, 80,  { type: "square", gain: 0.08 });
const beep   = () => tone(880, 220, { type: "sine",   gain: 0.2 });

/* ===================================================================
   Voice recognition — "ready" trigger
   =================================================================== */

function setupRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    log("Web Speech API not supported on this browser", "error");
    voiceHint.textContent = "voice not supported — use tap";
    toggleVoice.checked = false;
    toggleVoice.disabled = true;
    btnManualReady.disabled = false;
    return;
  }

  const rec = new SR();
  rec.lang = "en-US";
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 3;

  rec.onstart = () => {
    state.recognitionRunning = true;
    voiceHint.textContent = "listening for \u201Cready\u201D";
    log("recognition started");
  };

  rec.onend = () => {
    state.recognitionRunning = false;
    log("recognition ended");
    // iOS Safari / Chrome can auto-stop after silence. Restart if we still want it.
    if (state.sessionActive && toggleVoice.checked && state.phase === "listening") {
      if (!state.micRestartPending) {
        state.micRestartPending = true;
        setTimeout(() => {
          state.micRestartPending = false;
          if (state.sessionActive && toggleVoice.checked && state.phase === "listening") {
            try { rec.start(); } catch (e) { log("restart error: " + e.message, "error"); }
          }
        }, MIC_RESTART_DELAY);
      }
    }
  };

  rec.onerror = (e) => {
    log("recognition error: " + e.error, "error");
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      voiceHint.textContent = "mic blocked — use tap";
      toggleVoice.checked = false;
      btnManualReady.disabled = false;
    }
    // "no-speech" / "audio-capture" / "aborted" fall through; onend restart handles them
  };

  rec.onresult = (ev) => {
    // scan every new alternative for the wake word
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      for (let a = 0; a < r.length; a++) {
        const text = r[a].transcript.toLowerCase().trim();
        if (containsReady(text)) {
          log(`heard: "${text}" (final=${r.isFinal})`);
          onReadyTrigger();
          return;
        }
      }
    }
  };

  state.recognition = rec;
}

function containsReady(text) {
  // Tolerate common mis-hears: "ready", "reddy", "red E", "already" (trim)
  // Keep this narrow — we want precision over recall on a noisy range.
  const t = " " + text.replace(/[^a-z\s]/g, "") + " ";
  return / ready /.test(t) || / reddy /.test(t) || / redi /.test(t);
}

function startRecognition() {
  if (!state.recognition) return;
  if (state.recognitionRunning) return;
  try {
    state.recognition.start();
  } catch (e) {
    // "InvalidStateError" if already started — safe to ignore
    log("start recognition threw: " + e.message);
  }
}

function stopRecognition() {
  if (!state.recognition) return;
  try { state.recognition.stop(); } catch (_) {}
}

/* ===================================================================
   Session flow
   =================================================================== */

async function startSession() {
  if (!state.cameraReady) {
    await startCamera();
    await startPose();
  }
  state.sessionActive = true;
  btnSession.textContent = "End session";
  btnSession.classList.remove("primary");
  btnStop.disabled = true;
  btnManualReady.disabled = false;

  // Warm up audio context inside a user gesture
  try { audio().resume(); } catch(_) {}

  armListening();
}

function endSession() {
  state.sessionActive = false;
  stopRecognition();
  setStatus("idle", "idle");
  btnSession.textContent = "Start session";
  btnSession.classList.add("primary");
  btnStop.disabled = true;
  btnManualReady.disabled = true;
  voiceHint.textContent = "";
  log("session ended");
}

function armListening() {
  if (!state.sessionActive) return;
  setStatus("listening", "say \u201Cready\u201D");
  state.frames = [];
  btnStop.disabled = true;
  btnManualReady.disabled = false;
  if (toggleVoice.checked) startRecognition();
  else voiceHint.textContent = "voice off — tap \u201Cready\u201D";
}

function onReadyTrigger() {
  if (state.phase !== "listening") return;
  stopRecognition(); // don't keep listening through the countdown/swing
  runCountdown().then(startRecording);
}

async function runCountdown() {
  setStatus("countdown", "countdown");
  countdownBig.classList.add("on");
  const labels = ["3", "2", "1"];
  for (let i = 0; i < COUNTDOWN_MS.length; i++) {
    countdownBig.textContent = labels[i];
    if (i < COUNTDOWN_MS.length - 1) tick();
    else beep(); // last one is the "go" beep
    await wait(COUNTDOWN_MS[i]);
  }
  countdownBig.classList.remove("on");
}

function startRecording() {
  state.frames = [];
  state.recordStartT = performance.now();
  setStatus("recording", "recording");
  btnStop.disabled = false;
  btnManualReady.disabled = true;
  log("recording started");
}

function endSwing() {
  if (state.phase !== "recording") return;
  setStatus("analyzing", "analyzing");
  btnStop.disabled = true;
  const frames = state.frames.slice();
  log(`captured ${frames.length} frames`);
  // analyze on next tick so UI updates
  setTimeout(() => {
    const result = analyzeTempo(frames);
    renderResult(result, frames);
    // loop back to listening
    armListening();
  }, 30);
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ===================================================================
   Tempo analysis — W-shape wrist trace
   (copied faithfully from v0.1.6 per brief)
   =================================================================== */

function analyzeTempo(frames) {
  if (frames.length < 15) {
    return { ok: false, reason: "too few frames", frames };
  }

  // 1. Find Address = motion onset
  const addressIdx = findAddressOnset(frames);
  if (addressIdx === -1) {
    return { ok: false, reason: "no motion onset detected", frames };
  }

  // 2. Window = Address .. Address + MAX_SWING_MS
  const addressT = frames[addressIdx].t;
  const windowEnd = addressT + MAX_SWING_MS;
  const window = frames.filter(f => f.t >= addressT && f.t <= windowEnd);
  if (window.length < 10) {
    return { ok: false, reason: "window too short", frames };
  }

  // 3. Find prominent peaks (local MINIMA of wristY = high hands)
  const ys = window.map(f => f.wristY);
  const yMin = Math.min(...ys);
  const yMax = Math.max(...ys);
  const range = yMax - yMin;
  if (range < 0.05) {
    return { ok: false, reason: "not enough vertical hand motion", frames };
  }
  const prominence = PEAK_PROMINENCE * range;

  let peaks = findMinimaPeaks(window, prominence);

  // 4. Merge peaks within 300 ms — keep the higher-hands (smaller wristY) one
  peaks = mergeClosePeaks(peaks, window, PEAK_MERGE_MS);

  if (peaks.length < 2) {
    return {
      ok: false,
      reason: "incomplete swing — swing all the way through to the finish position",
      frames,
      addressIdx,
      peaks
    };
  }

  // 5. Top = first peak, Finish = second peak, Impact = deepest valley between them
  const topPeak    = peaks[0];
  const finishPeak = peaks[1];
  const impactPeak = findValleyBetween(window, topPeak.idx, finishPeak.idx);

  const topT    = window[topPeak.idx].t;
  const finishT = window[finishPeak.idx].t;
  const impactT = window[impactPeak.idx].t;

  // 6. Metrics
  const backswing_ms = Math.round(topT - addressT);
  const downswing_ms = Math.round(impactT - topT);
  if (downswing_ms <= 0 || backswing_ms <= 0) {
    return { ok: false, reason: "degenerate timing", frames };
  }
  const ratio = +(backswing_ms / downswing_ms).toFixed(2);
  const effFps = frames.length > 1
    ? +(frames.length / ((frames[frames.length - 1].t - frames[0].t) / 1000)).toFixed(1)
    : 0;

  return {
    ok: true,
    frames,
    window,
    addressIdx,
    topIdx:    topPeak.idx,
    impactIdx: impactPeak.idx,
    finishIdx: finishPeak.idx,
    metrics: {
      backswing_ms,
      downswing_ms,
      ratio,
      address_y: +frames[addressIdx].wristY.toFixed(3),
      top_y:     +window[topPeak.idx].wristY.toFixed(3),
      impact_y:  +window[impactPeak.idx].wristY.toFixed(3),
      wrist_rise: +(frames[addressIdx].wristY - window[topPeak.idx].wristY).toFixed(3),
      effective_fps: effFps
    }
  };
}

function findAddressOnset(frames) {
  // Smooth 5-frame window, find sustained upward motion (wristY decreasing)
  const N = frames.length;
  for (let i = 5; i < N - MOTION_ONSET_FRAMES; i++) {
    let sustained = true;
    for (let k = 0; k < MOTION_ONSET_FRAMES; k++) {
      const dy = frames[i + k - 1].wristY - frames[i + k].wristY;
      if (dy < MOTION_ONSET_UP) { sustained = false; break; }
    }
    if (sustained) {
      // backtrack slightly to pick the last stable frame before the rise
      return Math.max(0, i - 1);
    }
  }
  return -1;
}

function findMinimaPeaks(window, prominence) {
  // Local minima of wristY with prominence check against the larger of:
  // - left-side max since previous minimum
  // - right-side max until next minimum
  const ys = window.map(f => f.wristY);
  const n = ys.length;
  const candidates = [];
  for (let i = 2; i < n - 2; i++) {
    if (ys[i] < ys[i-1] && ys[i] < ys[i-2] && ys[i] < ys[i+1] && ys[i] < ys[i+2]) {
      candidates.push(i);
    }
  }
  // prominence filter
  const peaks = [];
  for (const idx of candidates) {
    const leftMax  = Math.max(...ys.slice(0, idx));
    const rightMax = Math.max(...ys.slice(idx + 1));
    const refMax   = Math.min(leftMax, rightMax);
    if ((refMax - ys[idx]) >= prominence) {
      peaks.push({ idx, y: ys[idx], t: window[idx].t });
    }
  }
  // order by time
  peaks.sort((a, b) => a.t - b.t);
  return peaks;
}

function mergeClosePeaks(peaks, window, gapMs) {
  if (peaks.length < 2) return peaks;
  const merged = [peaks[0]];
  for (let i = 1; i < peaks.length; i++) {
    const prev = merged[merged.length - 1];
    const cur  = peaks[i];
    if ((cur.t - prev.t) <= gapMs) {
      // keep the one with smaller wristY (higher hands)
      if (cur.y < prev.y) merged[merged.length - 1] = cur;
    } else {
      merged.push(cur);
    }
  }
  return merged;
}

function findValleyBetween(window, aIdx, bIdx) {
  let best = aIdx;
  let bestY = -Infinity;
  for (let i = aIdx + 1; i < bIdx; i++) {
    if (window[i].wristY > bestY) {
      bestY = window[i].wristY;
      best = i;
    }
  }
  return { idx: best, y: bestY, t: window[best].t };
}

/* ===================================================================
   Rendering — stats + trace chart
   =================================================================== */

function renderResult(res, frames) {
  if (!res.ok) {
    log(`swing not analyzed: ${res.reason}`);
    setStat("statBack", "—", "");
    setStat("statDown", "—", "");
    setStat("statRatio", res.reason, "fail");
    setStat("statFps",
      frames.length
        ? ((frames.length / ((frames[frames.length - 1].t - frames[0].t) / 1000)).toFixed(1))
        : "—",
      "");
    drawChart(frames, res);
    return;
  }
  const m = res.metrics;
  const inRange = m.ratio >= 2.5 && m.ratio <= 3.5;
  setStat("statBack",  m.backswing_ms + " ms", "");
  setStat("statDown",  m.downswing_ms + " ms", "");
  setStat("statRatio", m.ratio.toFixed(2) + " : 1", inRange ? "pass" : "fail");
  setStat("statFps",   m.effective_fps.toFixed(1), "");
  drawChart(frames, res);

  const verdict = inRange ? "PASS" : "OUT OF RANGE";
  log(`swing: back=${m.backswing_ms}ms down=${m.downswing_ms}ms ratio=${m.ratio} [${verdict}]`);
}

function setStat(id, value, cls) {
  const el = document.getElementById(id);
  el.className = "stat" + (cls ? " " + cls : "");
  el.querySelector(".value").textContent = value;
}

function drawChart(frames, res) {
  const W = chart.clientWidth;
  const H = chart.clientHeight;
  if (chart.width !== W || chart.height !== H) {
    chart.width = W; chart.height = H;
  }
  cctx.clearRect(0, 0, W, H);
  if (!frames || frames.length < 2) return;

  const tMin = frames[0].t;
  const tMax = frames[frames.length - 1].t;
  const ys = frames.map(f => f.wristY);
  const yMin = Math.min(...ys);
  const yMax = Math.max(...ys);
  const pad = 10;

  const xOf = t => pad + (t - tMin) / (tMax - tMin || 1) * (W - pad * 2);
  // invert Y so "hands high" renders up on screen (smaller wristY is smaller screen y)
  const yOf = y => pad + (y - yMin) / (yMax - yMin || 1) * (H - pad * 2);

  // grid baseline
  cctx.strokeStyle = "#1f2a25";
  cctx.lineWidth = 1;
  cctx.beginPath();
  cctx.moveTo(pad, H / 2); cctx.lineTo(W - pad, H / 2);
  cctx.stroke();

  // trace
  cctx.strokeStyle = "#9dd69a";
  cctx.lineWidth = 2;
  cctx.beginPath();
  frames.forEach((f, i) => {
    const x = xOf(f.t), y = yOf(f.wristY);
    if (i === 0) cctx.moveTo(x, y); else cctx.lineTo(x, y);
  });
  cctx.stroke();

  // annotate events if analysis was ok
  if (res && res.ok) {
    const mark = (idx, label, color) => {
      const f = (idx < res.frames.length) ? res.frames[idx] : null;
      if (!f) return;
      const x = xOf(f.t), y = yOf(f.wristY);
      cctx.fillStyle = color;
      cctx.beginPath(); cctx.arc(x, y, 5, 0, Math.PI * 2); cctx.fill();
      cctx.fillStyle = "#e8efe9";
      cctx.font = "11px JetBrains Mono, monospace";
      cctx.fillText(label, x + 6, y - 6);
    };
    // res.topIdx / impactIdx / finishIdx reference res.window frames, not the full frames[]
    const windowStart = res.addressIdx;
    mark(res.addressIdx,                 "A", "#e2b24a");
    mark(windowStart + res.topIdx,       "T", "#9dd69a");
    mark(windowStart + res.impactIdx,    "I", "#d87a7a");
    mark(windowStart + res.finishIdx,    "F", "#9dd69a");
  }
}

/* ===================================================================
   Wiring
   =================================================================== */

btnSession.addEventListener("click", () => {
  if (state.sessionActive) endSession();
  else startSession();
});

btnStop.addEventListener("click", endSwing);

btnManualReady.addEventListener("click", () => {
  if (state.phase === "listening") onReadyTrigger();
});

toggleVoice.addEventListener("change", () => {
  if (!state.sessionActive) return;
  if (toggleVoice.checked && state.phase === "listening") {
    startRecognition();
    voiceHint.textContent = "listening for \u201Cready\u201D";
  } else {
    stopRecognition();
    voiceHint.textContent = "voice off — tap \u201Cready\u201D";
  }
});

window.addEventListener("resize", () => drawChart([]));

// init
setupRecognition();
log("v0.2.0 loaded. tap Start session.");
</script>
